name: build

on:
  push:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: go-setup
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - id: vet-backend
        name: Vet backend
        working-directory: backend
        run: go vet ./...
      - id: test-backend
        name: Test backend
        working-directory: backend
        run: go test -timeout 120s ./...
      - id: build-backend
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: upload-backend-artifacts
        name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: aurad
          path: dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - id: typecheck-frontend
        name: Typecheck frontend
        working-directory: frontend
        run: npm install && npm run typecheck
      - id: build-frontend
        working-directory: frontend
        run: npm run build
      - id: upload-frontend-artifacts
        name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist/*
