name: build

on:
  push:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: go-setup
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      # The Go bindings regenerate on every `make -C backend build` (the `gen`
      # target), but the TypeScript ones only ever regenerate when a human
      # remembers to run api/schema/make.sh. So editing a .fbs and building the
      # backend silently produces Go bindings newer than the checked-in TS
      # ones, and the first symptom is a wire mismatch at runtime. Regenerate
      # both from the schemas and fail if anything moved. Both generators are
      # byte-idempotent, so a clean tree here means genuinely in sync.
      - id: check-generated-bindings
        name: Check generated FlatBuffers bindings match the schemas
        run: |
          set -euo pipefail
          (cd backend && go generate ./...)
          (cd api/schema && ./make.sh)
          if [ -n "$(git status --porcelain -- backend/pkg/api/AuraApi api/schema/js)" ]; then
            echo "::error::Generated FlatBuffers bindings are out of date. Run 'go generate ./...' in backend/ AND api/schema/make.sh, then commit the result."
            git status --porcelain -- backend/pkg/api/AuraApi api/schema/js
            git diff -- backend/pkg/api/AuraApi api/schema/js
            exit 1
          fi
      - id: vet-backend
        name: Vet backend
        working-directory: backend
        run: go vet ./...
      - id: test-backend
        name: Test backend
        working-directory: backend
        run: go test -timeout 120s ./...
      - id: build-backend
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: upload-backend-artifacts
        name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: aurad
          path: dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - id: typecheck-frontend
        name: Typecheck frontend
        working-directory: frontend
        run: npm install && npm run typecheck
      - id: test-frontend
        name: Test frontend
        working-directory: frontend
        run: npm test
      - id: build-frontend
        working-directory: frontend
        run: npm run build
      - id: upload-frontend-artifacts
        name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist/*
