<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" preserveAspectRatio="none">
  <!-- Placeholder bandit tent: TRUE top-down. The viewBox is 160x120 to match
       the 1.6 x 1.2 rect body in api/props/tent.json (preserveAspectRatio=none,
       so the two must stay in sync).

       ⛔ NO GUY ROPES OR PEGS (PO 2026-10-03). A prop draws OVER the
       characters, so ropes reaching out from the canvas would be lines painted
       across every player walking past. The body is the canvas alone.
       ⛔ AND NO OPEN DOORWAY. The second cut threw a flap back over a black
       triangle at the east end, and from above that read as a tear, not a door
       (PO: "odd/messy"). The entrance is CLOSED: a laced seam down the east
       gable, which says "front" without opening a hole in the shape.

       ⭐ A ridge tent from above is TWO PLANES meeting at a line, and the light
       (top-left) is what says so: the north slope is lit, the south one is not.
       Paint both the same and it is a rug. -->

  <!-- ground shadow, offset down-right (light from the top-left) -->
  <rect x="12" y="12" width="144" height="104" rx="5" fill="#000000" opacity="0.22"/>

  <!-- north slope, lit -->
  <path d="M6,6 L154,6 L154,60 L6,60 Z" fill="#d6c79f" stroke="#5a4a30" stroke-width="4" stroke-linejoin="round"/>
  <!-- south slope, in its own shade -->
  <path d="M6,60 L154,60 L154,114 L6,114 Z" fill="#a8976f" stroke="#5a4a30" stroke-width="4" stroke-linejoin="round"/>

  <!-- canvas seams running down each slope -->
  <g stroke="#7d6b48" stroke-width="2" opacity="0.6">
    <line x1="44" y1="8" x2="44" y2="58"/>
    <line x1="80" y1="8" x2="80" y2="58"/>
    <line x1="116" y1="8" x2="116" y2="58"/>
    <line x1="44" y1="62" x2="44" y2="112"/>
    <line x1="80" y1="62" x2="80" y2="112"/>
    <line x1="116" y1="62" x2="116" y2="112"/>
  </g>

  <!-- patches: the tent has been somewhere -->
  <rect x="54" y="20" width="20" height="16" fill="#b9a77a" stroke="#6b5938" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(-6 64 28)"/>
  <rect x="92" y="78" width="22" height="18" fill="#8c7b55" stroke="#5a4a30" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(5 103 87)"/>

  <!-- the front (east) gable: a closed, laced entrance -->
  <rect x="140" y="8" width="12" height="104" fill="#c8b98f" opacity="0.6"/>
  <line x1="146" y1="10" x2="146" y2="110" stroke="#5a4a30" stroke-width="2"/>
  <g stroke="#4a3a24" stroke-width="2" stroke-linecap="round">
    <line x1="142" y1="34" x2="150" y2="38"/>
    <line x1="142" y1="48" x2="150" y2="52"/>
    <line x1="142" y1="68" x2="150" y2="72"/>
    <line x1="142" y1="82" x2="150" y2="86"/>
  </g>

  <!-- the ridge pole, its ends showing past the canvas -->
  <line x1="4" y1="60" x2="156" y2="60" stroke="#4a3a24" stroke-width="5" stroke-linecap="round"/>
  <circle cx="5" cy="60" r="4" fill="#5c4729" stroke="#2b2014" stroke-width="1.5"/>
  <circle cx="155" cy="60" r="4" fill="#5c4729" stroke="#2b2014" stroke-width="1.5"/>
</svg>
