<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" preserveAspectRatio="none">
  <!-- Placeholder slum tent (plan-city-assets.md K3): TRUE top-down, a ROOF
       prop. The viewBox is 240x200 to match the 2.4 x 2 rect body in
       api/props/slum-tent.json (preserveAspectRatio=none, so the two must
       stay in sync); 100 units per metre. It fades to its revealAlpha while
       you stand under it, so the Bedroll beneath shows through.

       Not a tent anyone bought: a crooked branch for a ridge (N-S, so the
       sleeper lies along it) and whatever cloth was to hand thrown over it,
       patched brown on brown (R5), its hem weighted with stones. The west
       slope catches the light (top-left), the east one does not. The edge
       sags and wanders; nothing reaches past the canvas, because a roof
       draws over everyone walking past. -->
  <defs>
    <clipPath id="slumTentCloth">
      <path d="M24,10 L72,14 L119,6 L170,12 L222,8 Q228,52 222,96 Q230,140 224,188
               L174,182 L121,194 L66,186 L16,190 Q10,146 18,104 Q8,58 24,10 Z"/>
    </clipPath>
    <linearGradient id="slumTentLight" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- ground shadow, offset down-right -->
  <path d="M30,16 L78,20 L125,12 L176,18 L228,14 Q234,58 228,102 Q236,146 230,194
           L180,188 L127,198 L72,192 L22,196 Q16,152 24,110 Q14,64 30,16 Z"
        fill="#000000" opacity="0.22"/>

  <g clip-path="url(#slumTentCloth)">
    <!-- the base cloth -->
    <rect x="0" y="0" width="240" height="200" fill="#7d6142"/>
    <!-- patches: sacking, a dyed rag, an old blanket, a bit of hide -->
    <g stroke="#3e2c1a" stroke-width="1.4" stroke-dasharray="3 2">
      <rect x="10" y="4" width="70" height="62" fill="#8f7150" transform="rotate(-3 45 35)"/>
      <rect x="52" y="78" width="56" height="50" fill="#6a5034" transform="rotate(4 80 103)"/>
      <rect x="6" y="132" width="78" height="66" fill="#94784f" transform="rotate(2 45 165)"/>
      <rect x="130" y="2" width="96" height="58" fill="#6e5a40" transform="rotate(3 178 31)"/>
      <rect x="146" y="70" width="80" height="70" fill="#8a6a46" transform="rotate(-5 186 105)"/>
      <rect x="124" y="144" width="62" height="56" fill="#5f4a32" transform="rotate(-2 155 172)"/>
      <rect x="84" y="20" width="26" height="22" fill="#6f6b5a" transform="rotate(8 97 31)"/>
      <rect x="176" y="150" width="40" height="30" fill="#7a5a3e" transform="rotate(6 196 165)"/>
    </g>
    <!-- sacking weave on one patch, a stain on another -->
    <g stroke="#4d3a24" stroke-width="1" opacity="0.35">
      <line x1="14" y1="140" x2="84" y2="136"/>
      <line x1="14" y1="152" x2="84" y2="148"/>
      <line x1="14" y1="164" x2="84" y2="160"/>
      <line x1="14" y1="176" x2="84" y2="172"/>
    </g>
    <ellipse cx="180" cy="110" rx="18" ry="10" fill="#2a1d10" opacity="0.18"/>

    <!-- the east slope in its own shade -->
    <path d="M121,0 L240,0 L240,200 L121,200 Z" fill="#000000" opacity="0.2"/>
    <rect x="0" y="0" width="240" height="200" fill="url(#slumTentLight)"/>
  </g>

  <!-- the cloth's ragged edge -->
  <path d="M24,10 L72,14 L119,6 L170,12 L222,8 Q228,52 222,96 Q230,140 224,188
           L174,182 L121,194 L66,186 L16,190 Q10,146 18,104 Q8,58 24,10 Z"
        fill="none" stroke="#3a2a18" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- stones weighting the hem -->
  <g fill="#8a857a" stroke="#4a463e" stroke-width="1.5">
    <ellipse cx="22" cy="44" rx="9" ry="7"/>
    <ellipse cx="20" cy="156" rx="8" ry="6"/>
    <ellipse cx="222" cy="66" rx="8" ry="7"/>
    <ellipse cx="220" cy="170" rx="10" ry="7"/>
  </g>

  <!-- the ridge: a crooked branch, a rag tied round it -->
  <path d="M118,8 Q124,52 119,100 Q115,146 122,192" fill="none" stroke="#3b2a17" stroke-width="7" stroke-linecap="round"/>
  <path d="M117,10 Q122,52 117,100" fill="none" stroke="#6b5232" stroke-width="2" opacity="0.6"/>
  <rect x="112" y="92" width="14" height="10" fill="#a08a5c" stroke="#3e2c1a" stroke-width="1.2" transform="rotate(-8 119 97)"/>
</svg>
