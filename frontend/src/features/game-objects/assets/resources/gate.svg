<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="none">
  <!-- Placeholder FIELD GATE art: the break in a `Fence` path
       (docs/art/assets.csv prop-gate, "Field gate on the fence line").

       ⭐ FULLY OPEN, AND FULLY PASSABLE — the two have to agree. A gate in
       this game is not interactable (PO ruling 2026-09-20), so it has exactly
       two honest states: open and not blocking, or closed and blocking. The
       first draft was neither — a leaf standing half-swung over a gap you
       could walk through — and a prop whose picture and collider disagree is
       the worst of both. This one is open: the leaf is swung a full 90° clear
       of the line, the gap between the posts is empty, and
       `api/props/gate.json` says `blocksMovement: false` out loud, because
       absent means BLOCKING.
       ⚑ The closed variant is a one-line change if a sealed fence is ever
       wanted: swing the leaf back in line and drop that key.

       ⛔ THE SWING ARC IS GONE. The first draft painted the curve the leaf
       had worn into the ground — real, and a nice explanation of the pose,
       but it drew a second banana-shaped object beside the leaf and read as
       part of the gate. A gate that cannot move has no business advertising
       the motion (PO).

       ⚑ WHAT CARRIES IT, now that the arc does not: two chunky posts ON the
       fence line with a clear gap between them, one bar standing square to
       that line, and the iron — hinge straps where the bar meets its post, an
       EMPTY keeper on the other. The keeper being empty is what says open
       rather than missing.

       ⚑ The posts are deliberately CHUNKIER than the fence's own (0.28 u in
       fence-placeholder.png): a hanging post carries a leaf, a fence post
       carries a rail, and that difference is what stops the gate reading as
       two more fence posts.

       ⚑ The posts sit on the sprite's OWN CENTRELINE, so dropping the gate on
       a fence path puts them in the line with no hidden offset to remember.

       ⚑ A rect prop turns with its collider (plan-prop-scale.md C2b), so this
       is rotated to whatever direction its fence runs. The viewBox aspect
       MUST stay 5:4 to match the 2.0 x 1.6 body in api/props/gate.json.

       ⛔ ...AND `preserveAspectRatio="none"` IS LOAD-BEARING WITH IT. The SVG
       bake is SQUARE (Preloading.registerGameObjectSVG passes one `maxSize`
       for both axes), so a non-square viewBox is letterboxed into it by the
       default `xMidYMid meet` — and then SimpleProp.initShape stretches the
       whole square back out to the body's aspect, squashing the art inside.
       Firefox showed it plainly; other engines hid it. Every non-square prop
       here carries the attribute (a95a2f0d).

       ⚑ Timber palette lifted from tools/make-fence-tile.mjs so the gate and
       the fence it interrupts are the same wood. -->

  <!-- ⛔ Bare earth is drawn OPAQUE, never as a brown wash: a low-opacity
       brown over grass only dims the grass, and dim grass reads as shade.
       (burntCart.svg's scorch had to be re-done for exactly this.) -->
  <defs>
    <radialGradient id="gateWorn">
      <stop offset="0" stop-color="#7a6648" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#7a6648" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#7a6648" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the trodden ground in the gap — this is the way through, and it is the
       cue that survives being small. Not a swing arc: just where feet go. -->
  <ellipse cx="100" cy="82" rx="56" ry="44" fill="url(#gateWorn)"/>

  <!-- shadows, offset down-right (light from the top-left) -->
  <rect x="15" y="67" width="32" height="36" rx="5" fill="#000000" opacity="0.26"/>
  <rect x="163" y="67" width="32" height="36" rx="5" fill="#000000" opacity="0.26"/>
  <rect x="40" y="86" width="15" height="74" rx="7" fill="#000000" opacity="0.22"/>

  <!-- THE LEAF, square to the fence line. One bar, because that is all the
       top rail shows from above; the thinner line beside it is the rail
       underneath catching its own shade, and the only hint of depth here. -->
  <rect x="34" y="78" width="16" height="76" rx="7" fill="#3a2d1c"/>
  <rect x="36" y="80" width="12" height="72" rx="5" fill="#8a7150"/>
  <rect x="38" y="84" width="3" height="64" rx="1.5" fill="#bda986" opacity="0.5"/>
  <rect x="45" y="82" width="4" height="68" rx="2" fill="#5c4a33" opacity="0.65"/>

  <!-- the hanging post, with its two iron straps reaching onto the leaf -->
  <rect x="10" y="62" width="32" height="36" rx="5"
        fill="#6f5735" stroke="#2f2418" stroke-width="5"/>
  <rect x="13" y="65" width="26" height="6" rx="2" fill="#a68a63" opacity="0.5"/>
  <g fill="#6a6862" stroke="#2b2724" stroke-width="2.4">
    <rect x="22" y="88" width="7" height="18" rx="3"/>
    <rect x="34" y="88" width="7" height="18" rx="3"/>
  </g>
  <circle cx="42" cy="86" r="5.5" fill="#4a4844" stroke="#23211e" stroke-width="2.4"/>

  <!-- the latch post, and the KEEPER standing empty -->
  <rect x="158" y="62" width="32" height="36" rx="5"
        fill="#6f5735" stroke="#2f2418" stroke-width="5"/>
  <rect x="161" y="65" width="26" height="6" rx="2" fill="#a68a63" opacity="0.5"/>
  <path d="M158,72 Q145,80 158,88" fill="none" stroke="#6a6862" stroke-width="4.5"
        stroke-linecap="round"/>

  <!-- the latch tongue, on the free end of the leaf where it now points -->
  <rect x="33" y="146" width="18" height="9" rx="3"
        fill="#6a6862" stroke="#2b2724" stroke-width="2.4"/>
</svg>
