<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Placeholder crate art: TRUE top-down. A crate's lid is the only thing
       straight overhead ever shows, so this is boards + iron banding read
       from above, never a box drawn in three-quarter view. Square body, and
       rect props never rotate — which is fine here, because a crate's lid is
       symmetric enough that one orientation does not read as a mistake. -->

  <!-- ground shadow, offset down-right: light from the top-left, the same
       convention the wall tile's bevel and the prop art's baked shadows use -->
  <rect x="14" y="16" width="76" height="76" rx="3" fill="#000000" opacity="0.22"/>

  <!-- the body of the crate -->
  <rect x="10" y="10" width="78" height="78" rx="2"
        fill="#8a6234" stroke="#432c14" stroke-width="5" stroke-linejoin="round"/>

  <!-- lid boards: three planks with dark gaps between them -->
  <line x1="36" y1="12" x2="36" y2="86" stroke="#432c14" stroke-width="3.5" opacity="0.85"/>
  <line x1="62" y1="12" x2="62" y2="86" stroke="#432c14" stroke-width="3.5" opacity="0.85"/>
  <!-- the lit face of each board, top-left side of its own gap -->
  <rect x="14" y="14" width="18" height="70" fill="#a3763f" opacity="0.55"/>
  <rect x="40" y="14" width="18" height="70" fill="#a3763f" opacity="0.4"/>
  <rect x="66" y="14" width="18" height="70" fill="#a3763f" opacity="0.28"/>

  <!-- iron banding across the lid, and the corner brackets that hold it -->
  <rect x="10" y="40" width="78" height="9" fill="#5b5a56" opacity="0.8"/>
  <rect x="12" y="41" width="74" height="3" fill="#8b8a85" opacity="0.5"/>
  <rect x="12" y="12" width="14" height="14" fill="#5b5a56" opacity="0.85"/>
  <rect x="72" y="12" width="14" height="14" fill="#5b5a56" opacity="0.85"/>
  <rect x="12" y="72" width="14" height="14" fill="#5b5a56" opacity="0.85"/>
  <rect x="72" y="72" width="14" height="14" fill="#5b5a56" opacity="0.85"/>

  <!-- nail heads on the banding -->
  <circle cx="18" cy="18" r="2.2" fill="#2f2e2b" opacity="0.8"/>
  <circle cx="79" cy="18" r="2.2" fill="#2f2e2b" opacity="0.8"/>
  <circle cx="18" cy="79" r="2.2" fill="#2f2e2b" opacity="0.8"/>
  <circle cx="79" cy="79" r="2.2" fill="#2f2e2b" opacity="0.8"/>

  <!-- wear: a split along one board and a chipped corner -->
  <path d="M26,22 L24,44 L27,62" fill="none" stroke="#432c14"
        stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <path d="M88,64 L82,70 L88,76 Z" fill="#432c14" opacity="0.35"/>
</svg>
