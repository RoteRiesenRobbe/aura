<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Placeholder BROKEN CRATE art: crate.svg's wreck, the way ruinedHouse.svg
       is house.svg's. TRUE top-down, same palette and the same light from the
       top-left, so the two read as one crate before and after.

       ⭐ The cues that say SMASHED rather than OPENED: the lid is GONE from the
       top and lying in pieces, so you see INTO the box (dark floor, spilled
       straw); two sides still stand as an L, held by the one surviving corner
       bracket, while the other two have burst OUTWARD and lie flat; and every
       board end that broke is a pale splintered tooth, never a saw cut.

       ⚑ NON-BLOCKING (`blocksMovement: false` in api/props/broken-crate.json),
       because it is low debris now. Same 0.9x0.9 body as Crate, so a
       placement swaps between them without moving anything.
       ⛔ Plain `href` only, never `xlink:href` (pipeline.md §2). -->

  <!-- faint ground shadow: lower than the intact crate's, nothing tall left -->
  <rect x="16" y="16" width="70" height="70" rx="3" fill="#000000" opacity="0.14"/>

  <!-- ===== THE OPEN BOX: its floor, in shadow, seen from straight above ===== -->
  <rect x="14" y="14" width="66" height="66" fill="#3b2814"/>
  <line x1="36" y1="14" x2="36" y2="80" stroke="#24180b" stroke-width="2.5" opacity="0.8"/>
  <line x1="58" y1="14" x2="58" y2="80" stroke="#24180b" stroke-width="2.5" opacity="0.8"/>
  <rect x="16" y="16" width="18" height="62" fill="#5a3d1f" opacity="0.45"/>
  <rect x="38" y="16" width="18" height="62" fill="#5a3d1f" opacity="0.32"/>

  <!-- spilled straw packing, spreading out of the burst corner (south-east) -->
  <g stroke="#c9ad5e" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M30,40 L42,46"/>
    <path d="M38,30 L46,40"/>
    <path d="M44,52 L58,56"/>
    <path d="M52,44 L60,52"/>
    <path d="M56,62 L70,66"/>
    <path d="M62,58 L66,72"/>
    <path d="M70,74 L82,80"/>
    <path d="M74,68 L86,72"/>
    <path d="M80,84 L90,88"/>
  </g>
  <g stroke="#e0c97f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M34,48 L40,52"/>
    <path d="M48,36 L54,38"/>
    <path d="M60,64 L64,62"/>
    <path d="M76,78 L84,76"/>
  </g>

  <!-- ===== THE L STILL STANDING: north and west sides, the top-left bracket ===== -->
  <!-- shadow of the standing walls, cast down-right into the box -->
  <rect x="17" y="17" width="58" height="5" fill="#000000" opacity="0.35"/>
  <rect x="17" y="17" width="5" height="52" fill="#000000" opacity="0.35"/>
  <!-- north side: snapped short at its east end -->
  <path d="M10,10 L70,10 L74,12 L68,14 L72,17 L10,17 Z"
        fill="#8a6234" stroke="#432c14" stroke-width="3" stroke-linejoin="round"/>
  <rect x="12" y="11" width="54" height="2.2" fill="#a3763f" opacity="0.6"/>
  <path d="M68,10 L74,12 L68,14 L72,17 L66,17 Z" fill="#cbb287"/>
  <!-- west side: snapped short at its south end -->
  <path d="M10,10 L17,10 L17,64 L15,70 L13,65 L10,68 Z"
        fill="#8a6234" stroke="#432c14" stroke-width="3" stroke-linejoin="round"/>
  <rect x="11" y="12" width="2.2" height="50" fill="#a3763f" opacity="0.6"/>
  <path d="M10,62 L17,62 L15,70 L13,65 L10,68 Z" fill="#cbb287"/>
  <!-- the one corner bracket that held, and its nail -->
  <rect x="9" y="9" width="14" height="14" fill="#5b5a56" opacity="0.9"/>
  <circle cx="15" cy="15" r="2.2" fill="#2f2e2b" opacity="0.85"/>

  <!-- ===== THE BURST SIDES: east and south, fallen OUTWARD and lying flat ===== -->
  <!-- east side, hinged off its bottom corner and tipped out -->
  <g transform="rotate(14 84 50)">
    <rect x="80" y="28" width="9" height="50" rx="1.5" fill="#000000" opacity="0.2"
          transform="translate(2,2)"/>
    <rect x="80" y="28" width="9" height="50" rx="1.5"
          fill="#7d5830" stroke="#432c14" stroke-width="2.5"/>
    <rect x="81" y="30" width="2.2" height="46" fill="#a3763f" opacity="0.5"/>
    <path d="M80,28 L82,22 L84,27 L87,21 L89,28 Z" fill="#cbb287"
          stroke="#5c4a33" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <!-- south side, split in two where it hit the ground -->
  <g transform="rotate(-6 36 88)">
    <rect x="14" y="83" width="34" height="9" rx="1.5" fill="#7d5830"
          stroke="#432c14" stroke-width="2.5"/>
    <rect x="16" y="84" width="30" height="2.2" fill="#a3763f" opacity="0.5"/>
    <path d="M48,83 L54,85 L49,87 L55,90 L48,92 Z" fill="#cbb287"
          stroke="#5c4a33" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- its bottom-left bracket, sheared off and still riveted to the board -->
    <rect x="15" y="84" width="9" height="7" fill="#5b5a56" opacity="0.85"/>
  </g>
  <g transform="rotate(9 66 90)">
    <rect x="56" y="86" width="22" height="8" rx="1.5" fill="#7d5830"
          stroke="#432c14" stroke-width="2.5"/>
    <path d="M56,86 L51,88 L56,90 L50,93 L56,94 Z" fill="#cbb287"
          stroke="#5c4a33" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- ===== THE LID, in pieces ===== -->
  <!-- one lid board lying across the open box, still carrying a stub of the
       iron band, snapped at both ends -->
  <g transform="rotate(-32 50 50)">
    <rect x="26" y="44" width="46" height="13" rx="1.5" fill="#000000" opacity="0.28"
          transform="translate(3,3)"/>
    <rect x="26" y="44" width="46" height="13" rx="1.5"
          fill="#8a6234" stroke="#432c14" stroke-width="2.5"/>
    <rect x="28" y="45" width="42" height="3" fill="#a3763f" opacity="0.6"/>
    <rect x="44" y="44" width="8" height="13" fill="#5b5a56" opacity="0.85"/>
    <circle cx="48" cy="50.5" r="1.8" fill="#2f2e2b" opacity="0.85"/>
    <path d="M26,44 L21,47 L25,50 L20,53 L26,57 Z" fill="#cbb287"
          stroke="#5c4a33" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M72,44 L77,46 L73,49 L78,53 L72,57 Z" fill="#cbb287"
          stroke="#5c4a33" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <!-- a short lid fragment thrown clear, north-east -->
  <g transform="rotate(24 86 16)">
    <rect x="78" y="11" width="16" height="9" rx="1.5" fill="#8a6234"
          stroke="#432c14" stroke-width="2.2"/>
    <path d="M78,11 L74,13 L78,15 L74,18 L78,20 Z" fill="#cbb287"/>
  </g>

  <!-- loose splinters and a bent nail -->
  <g fill="#cbb287" stroke="#5c4a33" stroke-width="1" stroke-linejoin="round">
    <path d="M28,70 L40,66 L30,73 Z"/>
    <path d="M62,28 L70,22 L66,31 Z"/>
    <path d="M90,62 L96,70 L89,67 Z"/>
  </g>
  <path d="M40,24 L44,24 L46,21" fill="none" stroke="#2f2e2b"
        stroke-width="1.4" stroke-linecap="round"/>
</svg>
