<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;">
  <!-- PROP "missing art" placeholder (plan-prop-placeholders.md C2), the
       counterpart to npcPlaceholder.svg beside it. Same loud purple/red
       language, squared off rather than round so a placeholder PROP and a
       placeholder NPC are told apart at a glance.

       ⚑ THIS FILE IS NEVER DRAWN IN-GAME. A PropPlaceholder prop is rendered
       procedurally by Props.ts — the authored footprint's outline with the
       prop's name auto-fit inside it — because one sprite cannot be a circle
       AND a 4:3 rect AND a 2:0.6 bench. It exists for the Tiled palette
       generator, which builds props.tsx as an image-collection tileset with
       one tile per prop type and resolves each type's `sprite` to a real file
       (tools/tiled/generate-palette.mjs). It is what you click to place one. -->
