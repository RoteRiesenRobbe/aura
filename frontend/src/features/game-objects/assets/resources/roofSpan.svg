<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 160" preserveAspectRatio="none">
  <!-- Roof kit: SPAN, a straight gable segment. TRUE top-down, a ROOF piece.
       The viewBox is 80x160 to match the 2 x 4 rect body in api/props/roof-span-*.json
       (preserveAspectRatio=none, so the two must stay in sync); 40 units per metre.
       The ridge runs east-west through the middle and every course and the
       ridge cap run off the east and west edges, so spans laid end to end read
       as one roof with no seam; a run that stops on a span is a gable end.
       NEUTRAL light grey on purpose: the client multiplies it by the
       definition's tint (slate, clay, stone, copper). Shading falls toward each
       eave, never toward a compass side, so a turned piece stays lit the same. -->
  <defs>
    <!-- shingles: two courses per tile, joints offset half a shingle, tones varied -->
    <pattern id="roofSpanShingle" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="10" fill="#dadada"/>
      <rect x="20" y="0" width="20" height="10" fill="#cfcfcf"/>
      <rect x="-10" y="10" width="20" height="10" fill="#e3e3e3"/>
      <rect x="10" y="10" width="20" height="10" fill="#d4d4d4"/>
      <rect x="30" y="10" width="20" height="10" fill="#e3e3e3"/>
      <path d="M0,10 H40 M0,20 H40 M0,0 V10 M20,0 V10 M10,10 V20 M30,10 V20" fill="none" stroke="#8c8c8c" stroke-width="1"/>
    </pattern>
    <linearGradient id="roofSpanNorth" gradientUnits="userSpaceOnUse" x1="0" y1="75" x2="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="roofSpanSouth" gradientUnits="userSpaceOnUse" x1="0" y1="85" x2="0" y2="160">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- the two pitches -->
  <rect x="0" y="0" width="80" height="160" fill="url(#roofSpanShingle)"/>
  <rect x="0" y="0" width="80" height="80" fill="url(#roofSpanNorth)"/>
  <rect x="0" y="80" width="80" height="80" fill="url(#roofSpanSouth)"/>

  <!-- eaves -->
  <rect x="0" y="0" width="80" height="2.5" fill="#000" opacity="0.28"/>
  <rect x="0" y="157.5" width="80" height="2.5" fill="#000" opacity="0.28"/>

  <!-- ridge cap: half-round tiles, a joint every 20 so it repeats across the join -->
  <rect x="0" y="74" width="80" height="12" fill="#efefef"/>
  <path d="M0,74 H80 M0,86 H80" stroke="#7a7a7a" stroke-width="1.4"/>
  <path d="M10,74 V86 M30,74 V86 M50,74 V86 M70,74 V86" stroke="#9a9a9a" stroke-width="1"/>
  <rect x="0" y="78.5" width="80" height="2" fill="#fff" opacity="0.6"/>
</svg>
