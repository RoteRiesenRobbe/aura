<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" preserveAspectRatio="none">
  <!-- Placeholder altar (plan-city-assets.md K2): TRUE top-down, a stone
       altar block under a white cloth. The viewBox is 240x120 to match the
       2.4 x 1.2 rect body in api/props/altar.json (preserveAspectRatio=none,
       so the two must stay in sync). It stands at the nave's south end, the
       priest's side to the south, so the cloth's gold-banded fall hangs over
       the NORTH edge, toward the pews.

       The cathedral's gold lives here: two candlesticks, a cross, a chalice
       and the book. Kept to those, so the altar reads as one thing. -->

  <!-- ground shadow, offset down-right -->
  <rect x="9" y="10" width="228" height="108" rx="3" fill="#000000" opacity="0.26"/>

  <!-- the stone block, a lip of it showing past the cloth -->
  <rect x="4" y="4" width="228" height="108" rx="3" fill="#a19d93" stroke="#4f4c45" stroke-width="3"/>
  <rect x="7" y="7" width="222" height="6" fill="#cfcbc0" opacity="0.55"/>
  <rect x="7" y="104" width="222" height="5" fill="#5f5c55" opacity="0.5"/>

  <!-- the altar cloth -->
  <rect x="12" y="10" width="212" height="92" fill="#e8e2d2" stroke="#8a8270" stroke-width="2"/>
  <rect x="12" y="10" width="212" height="40" fill="#ffffff" opacity="0.25"/>
  <!-- the gold band where the cloth falls over the north edge -->
  <rect x="12" y="10" width="212" height="12" fill="#c9a640" stroke="#6e5520" stroke-width="1.2"/>
  <g fill="#f0d98a" opacity="0.7">
    <circle cx="36" cy="16" r="2"/><circle cx="66" cy="16" r="2"/><circle cx="96" cy="16" r="2"/>
    <circle cx="144" cy="16" r="2"/><circle cx="174" cy="16" r="2"/><circle cx="204" cy="16" r="2"/>
  </g>
  <!-- folds in the cloth, and a wax drip -->
  <g stroke="#b5ad98" stroke-width="1.2" opacity="0.6">
    <line x1="60" y1="26" x2="62" y2="100"/>
    <line x1="178" y1="26" x2="176" y2="100"/>
  </g>
  <ellipse cx="44" cy="74" rx="5" ry="3" fill="#d8cfae" opacity="0.8"/>

  <!-- the cross at the centre, its shadow down-right -->
  <path d="M115,36 H125 V50 H139 V60 H125 V88 H115 V60 H101 V50 H115 Z" fill="#000000" opacity="0.3"
        transform="translate(4 4)"/>
  <path d="M115,36 H125 V50 H139 V60 H125 V88 H115 V60 H101 V50 H115 Z" fill="#c9a640" stroke="#6e5520"
        stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M116.5,37.5 H120 V86 H116.5 Z M102.5,51.5 H137 V54.5 H102.5 Z" fill="#f0d98a" opacity="0.55"/>

  <!-- two candlesticks, a candle each, the flames lit -->
  <circle cx="32" cy="60" r="12" fill="#000000" opacity="0.28" transform="translate(3 3)"/>
  <circle cx="32" cy="60" r="12" fill="#b8923a" stroke="#6e5520" stroke-width="2"/>
  <circle cx="32" cy="60" r="6" fill="#efe6c8" stroke="#8a8270" stroke-width="1"/>
  <circle cx="32" cy="60" r="2.4" fill="#ffcf80"/>
  <circle cx="204" cy="60" r="12" fill="#000000" opacity="0.28" transform="translate(3 3)"/>
  <circle cx="204" cy="60" r="12" fill="#b8923a" stroke="#6e5520" stroke-width="2"/>
  <circle cx="204" cy="60" r="6" fill="#efe6c8" stroke="#8a8270" stroke-width="1"/>
  <circle cx="204" cy="60" r="2.4" fill="#ffcf80"/>

  <!-- the open book, and the chalice -->
  <path d="M64,62 L84,58 L84,90 L64,94 Z" fill="#000000" opacity="0.25" transform="translate(2 2)"/>
  <path d="M64,62 L84,58 L104,62 L104,94 L84,90 L64,94 Z" fill="#f2ecdc" stroke="#5a1f22" stroke-width="2"/>
  <line x1="84" y1="58" x2="84" y2="90" stroke="#5a1f22" stroke-width="1.5"/>
  <g stroke="#8a8270" stroke-width="0.9" opacity="0.7">
    <line x1="68" y1="70" x2="80" y2="68"/><line x1="68" y1="76" x2="80" y2="74"/>
    <line x1="68" y1="82" x2="80" y2="80"/><line x1="88" y1="68" x2="100" y2="70"/>
    <line x1="88" y1="74" x2="100" y2="76"/><line x1="88" y1="80" x2="100" y2="82"/>
  </g>
  <circle cx="166" cy="76" r="9" fill="#000000" opacity="0.28" transform="translate(2.5 2.5)"/>
  <circle cx="166" cy="76" r="9" fill="#c9a640" stroke="#6e5520" stroke-width="1.6"/>
  <circle cx="166" cy="76" r="5.5" fill="#5a1f22"/>
  <circle cx="163" cy="73" r="1.6" fill="#ffffff" opacity="0.5"/>
</svg>
