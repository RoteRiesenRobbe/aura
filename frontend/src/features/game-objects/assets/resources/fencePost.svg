<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Placeholder fence-post art: TRUE top-down, which for a post means you
       are looking at its END GRAIN — a small squared-off top and nothing
       else. The same reasoning the tombstone's comment records: a standing
       thing shows its narrow top, never its face.

       ⚑ It carries NO rail stubs on purpose. This prop exists to cap a
       hedgerow or fence authored as a PATH, and a path can leave in any
       direction — but a prop's authored rotation is not applied (server-side
       for circles, at all for rects), so a stub would point the wrong way at
       most of the posts in the game. A bare post reads correctly from every
       approach. -->

  <!-- ground shadow, offset down-right (light from the top-left) -->
  <ellipse cx="53" cy="55" rx="24" ry="22" fill="#000000" opacity="0.24"/>

  <!-- scuffed earth where the post was driven in -->
  <ellipse cx="50" cy="52" rx="27" ry="24" fill="#5a4632" opacity="0.5"/>

  <!-- the post's squared top, corners knocked off by weather -->
  <rect x="28" y="28" width="44" height="44" rx="7"
        fill="#8a6234" stroke="#432c14" stroke-width="5" stroke-linejoin="round"/>

  <!-- top-left facet catches the light -->
  <path d="M33,33 Q50,28 67,33 Q50,38 33,49 Z" fill="#a3763f" opacity="0.5"/>

  <!-- end grain: a few rings and the heartwood split every dry post has -->
  <ellipse cx="50" cy="50" rx="13" ry="13" fill="none"
           stroke="#6b4a26" stroke-width="2" opacity="0.7"/>
  <ellipse cx="50" cy="50" rx="6" ry="6" fill="none"
           stroke="#6b4a26" stroke-width="1.8" opacity="0.6"/>
  <path d="M50,31 L52,44 L49,56 L51,69" fill="none" stroke="#432c14"
        stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>

  <!-- the nail that held the rail, and a little moss on the north side -->
  <circle cx="63" cy="62" r="2.6" fill="#3d3b36" opacity="0.8"/>
  <ellipse cx="36" cy="37" rx="6" ry="3.4" fill="#5f7a3d" opacity="0.45"
           transform="rotate(-38 36 37)"/>
</svg>
