<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <!-- Placeholder corner tower roof (city walls, docs/archive/plan-city-assets.md
       K7): TRUE top-down, a ROOF prop on a circle body (r 5.5,
       api/props/corner-tower-roof.json), so the canvas is the 11 m square
       around it; 20 units per metre. It fades while you stand under it, so
       the guard room inside shows; the ring wall and its door are Wall paths
       in the zone, not this art.

       The tower's open top seen from straight above, filling the circle and
       nothing else (the square's corners stay empty, so the circle-body fade
       opens wherever the roof is drawn): a crenellated parapet of the city's
       grey wall stone, 16 merlons lit from the top-left, a flagged wall
       walk, an oak deck, the head of the spiral stair, a brazier and a
       pennant pole. The shadow stays inside the parapet (a roof draws over
       everyone walking past). Generated by a scratch script so the merlons
       are even; edit freely. -->
  <defs>
    <clipPath id="cornerTowerDisc"><circle cx="110" cy="110" r="110"/></clipPath>
    <linearGradient id="cornerTowerLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6a299"/>
      <stop offset="0.55" stop-color="#85817a"/>
      <stop offset="1" stop-color="#5a5752"/>
    </linearGradient>
    <linearGradient id="cornerTowerMerlon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdb9af"/>
      <stop offset="0.55" stop-color="#9a968c"/>
      <stop offset="1" stop-color="#6c6963"/>
    </linearGradient>
    <clipPath id="cornerTowerDeck"><circle cx="110" cy="110" r="70"/></clipPath>
  </defs>

