<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 140" preserveAspectRatio="none">
  <!-- Placeholder bedroll: TRUE top-down, a blanket roll laid out flat with
       its pack rolled up at the head (north). The viewBox is 50x140 to match
       the 0.5 x 1.4 rect body in api/props/bedroll.json - about a player wide.

       ⛔ ONE BROWN, on purpose (PO 2026-10-03: "to read less like a real bed
       or chocolate bar"). The first cut had a red blanket, pale woven stripes
       and a turned-back cream lining, and every one of those is BEDDING: a
       made bed, a duvet, a candy wrapper. A camp bedroll is one drab wool
       roll, so the whole drawing is a single brown with only value changes.
       ⚑ NON-BLOCKING by definition, so the shadow is barely there. -->

  <!-- a whisper of shadow -->
  <rect x="7" y="8" width="40" height="130" rx="10" fill="#000000" opacity="0.12"/>

  <!-- the blanket, laid flat; soft edges, no hems -->
  <rect x="5" y="26" width="40" height="110" rx="9" fill="#6e5236" stroke="#33251a" stroke-width="2.5"/>
  <!-- the slight hollow where somebody lay -->
  <ellipse cx="25" cy="82" rx="12" ry="40" fill="#5d4530" opacity="0.7"/>
  <!-- rumples, the only marks on it -->
  <g stroke="#3e2d1f" stroke-width="1.6" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M10,58 Q18,54 26,60"/>
    <path d="M24,104 Q32,98 40,104"/>
  </g>

  <!-- the pack, rolled, as a pillow: the same brown a step lighter -->
  <rect x="6" y="5" width="38" height="22" rx="10" fill="#856546" stroke="#33251a" stroke-width="2.5"/>
  <rect x="9" y="8" width="32" height="6" rx="3" fill="#9a7a58" opacity="0.6"/>
  <g stroke="#4a3624" stroke-width="2.5">
    <line x1="16" y1="6" x2="16" y2="26"/>
    <line x1="34" y1="6" x2="34" y2="26"/>
  </g>
</svg>
