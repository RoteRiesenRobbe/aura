<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130">
  <!-- Placeholder farm-cart art: TRUE top-down. The viewBox is 220x130 to
       match the 2.2 x 1.3 rect body in api/props/cart.json — the render class
       scales width and height independently, so the two must stay in sync
       (the same note house.svg carries, and the same trap).

       ⚑ The shaft points WEST and every cart in the game will, because a
       rect prop's rotation is never applied. It is drawn anyway: without it
       this is a box with wheels, and the cart has to read as a cart for the
       burnt-cart POI to land. Few placements, so one orientation is a price
       worth paying — if a zone ever wants a yard full of them, the shaft is
       what to cut first. -->

  <!-- ground shadow, offset down-right (light from the top-left) -->
  <rect x="34" y="20" width="176" height="100" rx="8" fill="#000000" opacity="0.22"/>

  <!-- the shaft the draught animal goes between -->
  <rect x="6" y="46" width="46" height="8" rx="4" fill="#7a5730" stroke="#402a13" stroke-width="3"/>
  <rect x="6" y="76" width="46" height="8" rx="4" fill="#7a5730" stroke="#402a13" stroke-width="3"/>
  <rect x="4" y="44" width="10" height="42" rx="5" fill="#6b4c2a" stroke="#402a13" stroke-width="3"/>

  <!-- wheels, seen end-on from above: a dark rim with the hub showing -->
  <g fill="#4a3a22" stroke="#2b1f10" stroke-width="3">
    <rect x="52" y="6" width="40" height="17" rx="8"/>
    <rect x="52" y="107" width="40" height="17" rx="8"/>
    <rect x="140" y="6" width="40" height="17" rx="8"/>
    <rect x="140" y="107" width="40" height="17" rx="8"/>
  </g>
  <g fill="#6b5530" opacity="0.8">
    <circle cx="72" cy="14" r="4"/>
    <circle cx="72" cy="115" r="4"/>
    <circle cx="160" cy="14" r="4"/>
    <circle cx="160" cy="115" r="4"/>
  </g>

  <!-- the bed -->
  <rect x="30" y="18" width="176" height="94" rx="6"
        fill="#8a6234" stroke="#402a13" stroke-width="5" stroke-linejoin="round"/>

  <!-- floor planks, running the length of the bed -->
  <g stroke="#402a13" stroke-width="3" opacity="0.75">
    <line x1="34" y1="42" x2="202" y2="42"/>
    <line x1="34" y1="65" x2="202" y2="65"/>
    <line x1="34" y1="88" x2="202" y2="88"/>
  </g>
  <rect x="34" y="22" width="168" height="17" fill="#a3763f" opacity="0.45"/>
  <rect x="34" y="46" width="168" height="16" fill="#a3763f" opacity="0.3"/>

  <!-- side rails, thicker than the planks so the bed has walls -->
  <rect x="30" y="18" width="176" height="9" rx="4" fill="#6b4c2a" stroke="#402a13" stroke-width="3"/>
  <rect x="30" y="103" width="176" height="9" rx="4" fill="#6b4c2a" stroke="#402a13" stroke-width="3"/>
  <rect x="196" y="18" width="10" height="94" rx="4" fill="#6b4c2a" stroke="#402a13" stroke-width="3"/>

  <!-- a little straw left in the bed, tying it to the haystack beside it -->
  <g stroke="#b8942f" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="36" x2="150" y2="44"/>
    <line x1="126" y1="52" x2="158" y2="49"/>
    <line x1="118" y1="70" x2="152" y2="76"/>
    <line x1="132" y1="86" x2="162" y2="80"/>
    <line x1="146" y1="60" x2="176" y2="66"/>
  </g>

  <!-- iron corner braces -->
  <g fill="#5b5a56" opacity="0.85">
    <rect x="33" y="21" width="13" height="10" rx="2"/>
    <rect x="190" y="21" width="13" height="10" rx="2"/>
    <rect x="33" y="99" width="13" height="10" rx="2"/>
    <rect x="190" y="99" width="13" height="10" rx="2"/>
  </g>
</svg>
