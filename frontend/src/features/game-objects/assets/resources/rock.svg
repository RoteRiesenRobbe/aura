<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rock / Boulder (api/props/rock.json, boulder.json): a TRUE top-down
       granite boulder, replacing the side-on stone.png that read wrong at any
       rotation but 0. Lit from straight overhead: a flat cleaved top, chiselled
       flanks fanning down from it whose tones vary by facet, not by a light
       direction, and a body that darkens evenly toward its rim over an even
       contact shadow, so an authored rotation turns the rock, never its light.
       No clipPath or filter: Tiled draws this file in the palette. -->
  <defs>
    <radialGradient id="rock-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0.8" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rock-body" cx="49%" cy="49%" r="50%">
      <stop offset="0" stop-color="#a39e93"/>
      <stop offset="0.55" stop-color="#8b867c"/>
      <stop offset="1" stop-color="#5a564f"/>
    </radialGradient>
  </defs>

  <!-- soft contact shadow, even all round -->
  <circle cx="50" cy="50" r="50" fill="url(#rock-shadow)"/>

  <!-- the body: outline o0..o11 -->
  <path d="M38,7 L58,5 L77,12 L91,28 L95,50 L89,71 L73,89 L50,95 L28,89 L11,72 L6,48 L14,25 Z" fill="url(#rock-body)"/>

  <!-- the flanks, each facet a shade of its own -->
  <path d="M14,25 L38,7 L58,5 L44,30 Z" fill="#ffffff" opacity="0.1"/>
  <path d="M58,5 L77,12 L91,28 L66,36 L44,30 Z" fill="#000000" opacity="0.06"/>
  <path d="M91,28 L95,50 L62,60 L66,36 Z" fill="#ffffff" opacity="0.08"/>
  <path d="M95,50 L89,71 L73,89 L62,60 Z" fill="#000000" opacity="0.14"/>
  <path d="M73,89 L50,95 L28,89 L40,62 L62,60 Z" fill="#ffffff" opacity="0.05"/>
  <path d="M28,89 L11,72 L26,46 L40,62 Z" fill="#000000" opacity="0.1"/>
  <path d="M11,72 L6,48 L14,25 L26,46 Z" fill="#ffffff" opacity="0.06"/>
  <path d="M14,25 L44,30 L26,46 Z" fill="#000000" opacity="0.05"/>

  <!-- moss in the hollow of two flanks -->
  <path d="M30,87 Q20,82 13,72 Q18,73 24,78 Q29,80 36,79 Z" fill="#4c6530" opacity="0.6"/>
  <path d="M86,30 Q90,36 92,44 Q88,42 84,36 Z" fill="#4c6530" opacity="0.5"/>

  <!-- the cleaved top -->
  <path d="M44,30 L66,36 L62,60 L40,62 L26,46 Z" fill="#c6c1b5" opacity="0.55"/>

  <!-- ridges: a dark joint with its lit lip beside it -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58,5 L44,30 M91,28 L66,36 M95,50 L62,60 M73,89 L62,60 M28,89 L40,62 M11,72 L26,46 M14,25 L44,30 M14,25 L26,46"
          stroke="#3e3a34" stroke-width="0.9" opacity="0.55"/>
    <path d="M44,30 L66,36 L62,60 L40,62 L26,46 Z" stroke="#3e3a34" stroke-width="1" opacity="0.6"/>
    <path d="M45,31.2 L65,36.6 L61.2,59" stroke="#e4dfd4" stroke-width="0.7" opacity="0.6"/>
  </g>

  <!-- a crack across the top, its far lip catching light -->
  <path d="M30,47 L39,46 L45,40 L53,44 L57,52" fill="none" stroke="#35312c" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39.4,47.2 L45.3,41.4 L52.9,45.2" fill="none" stroke="#e4dfd4" stroke-width="0.55" stroke-linecap="round" opacity="0.6"/>
  <path d="M53,44 L60,40" fill="none" stroke="#35312c" stroke-width="0.7" stroke-linecap="round"/>

  <!-- granite grain -->
  <g fill="#e6e1d6" opacity="0.4">
    <circle cx="50" cy="34" r="0.6"/><circle cx="57" cy="49" r="0.5"/><circle cx="35" cy="54" r="0.6"/>
    <circle cx="72" cy="22" r="0.5"/><circle cx="80" cy="56" r="0.5"/><circle cx="22" cy="34" r="0.6"/>
    <circle cx="48" cy="78" r="0.5"/><circle cx="64" cy="76" r="0.6"/>
  </g>
  <g fill="#2f2c27" opacity="0.4">
    <circle cx="45" cy="52" r="0.5"/><circle cx="60" cy="28" r="0.6"/><circle cx="30" cy="70" r="0.6"/>
    <circle cx="84" cy="44" r="0.5"/><circle cx="18" cy="56" r="0.5"/><circle cx="56" cy="84" r="0.6"/>
    <circle cx="76" cy="70" r="0.5"/><circle cx="38" cy="18" r="0.5"/>
  </g>

  <!-- pale lichen crust on the top -->
  <g fill="#b6b578" opacity="0.65">
    <circle cx="51" cy="54" r="2.4"/><circle cx="54" cy="55.5" r="1.6"/><circle cx="49" cy="56.8" r="1.1"/>
    <circle cx="36" cy="38" r="1.4"/><circle cx="38" cy="36.8" r="0.9"/>
  </g>

  <!-- the outline -->
  <path d="M38,7 L58,5 L77,12 L91,28 L95,50 L89,71 L73,89 L50,95 L28,89 L11,72 L6,48 L14,25 Z" fill="none" stroke="#2c2925" stroke-width="2" stroke-linejoin="round"/>
</svg>
