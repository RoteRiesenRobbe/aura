    <line x1="39" y1="55" x2="39" y2="64"/>
    <line x1="21" y1="64" x2="21" y2="70"/>
    <line x1="33" y1="64" x2="33" y2="70"/>
  </g>
  <path d="M9,10 H41 V14 H13 V70 H9 Z" fill="#000000" opacity="0.3"/>
  <rect x="1" y="1" width="48" height="1.6" fill="#d2cec4" opacity="0.5"/>
  <rect x="1" y="1" width="1.6" height="78" fill="#d2cec4" opacity="0.4"/>
  <rect x="1" y="77.4" width="48" height="1.6" fill="#2a2824" opacity="0.55"/>
  <rect x="47.4" y="1" width="1.6" height="78" fill="#2a2824" opacity="0.55"/>

