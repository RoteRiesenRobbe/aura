    <rect x="151.5" y="56" width="7" height="8"/>
  </g>
  <rect x="119" y="10" width="32" height="60" fill="#8e8a81" stroke="#2a2824" stroke-width="1"/>
  <g stroke="#4d4a45" stroke-width="0.7" opacity="0.7">
    <line x1="119" y1="19" x2="151" y2="19"/>
    <line x1="119" y1="28" x2="151" y2="28"/>
    <line x1="119" y1="37" x2="151" y2="37"/>
