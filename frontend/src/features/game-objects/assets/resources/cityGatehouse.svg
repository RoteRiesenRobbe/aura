    <line x1="39" y1="19" x2="39" y2="28"/>
    <line x1="21" y1="28" x2="21" y2="37"/>
    <line x1="33" y1="28" x2="33" y2="37"/>
    <line x1="15" y1="37" x2="15" y2="46"/>
    <line x1="27" y1="37" x2="27" y2="46"/>
    <line x1="39" y1="37" x2="39" y2="46"/>
    <line x1="21" y1="46" x2="21" y2="55"/>
    <line x1="33" y1="46" x2="33" y2="55"/>
