  <path d="M119,10 H151 V14 H123 V70 H119 Z" fill="#000000" opacity="0.3"/>
  <rect x="111" y="1" width="48" height="1.6" fill="#d2cec4" opacity="0.5"/>
  <rect x="111" y="1" width="1.6" height="78" fill="#d2cec4" opacity="0.4"/>
  <rect x="111" y="77.4" width="48" height="1.6" fill="#2a2824" opacity="0.55"/>
