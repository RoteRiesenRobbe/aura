<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" preserveAspectRatio="none">
  <!-- Placeholder city gatehouse (city walls, docs/archive/plan-city-assets.md
       K7): TRUE top-down. The viewBox is 160x80 to match the 8 x 4 rect body
       in api/props/city-gatehouse.json (preserveAspectRatio=none, so the two
       must stay in sync); 20 units per metre. The OUTSIDE of the city is the
       TOP edge: a placement's rotation turns it to face out (north 0, south
       pi, west 3pi/2).

       NOT a roof and NOT solid: it is art laid over a gap in the city wall.
       The two flanking towers are blocked by Wall paths in the zone, and the
       3 m passage between them is open sky, so the art sits in props >
       underfoot and a player walking through draws over the paving. A closed
       gate is a solid prop across the passage (the west gate's JailBars
       portcullis), never this art.

       Two square towers of the city's grey wall stone, crenellated, with
       flagged tops; between them a cobbled passage, the portcullis slot near
       the outer face, and the two oak leaves swung open against the passage
       walls on the city side, strapped in iron. Lit from the top-left; the
       left tower's shadow falls across the passage. Nothing past the canvas. -->
  <defs>
    <linearGradient id="cityGateLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6a299"/>
      <stop offset="0.55" stop-color="#85817a"/>
      <stop offset="1" stop-color="#5a5752"/>
    </linearGradient>
    <linearGradient id="cityGateMerlon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdb9af"/>
      <stop offset="1" stop-color="#7a7770"/>
    </linearGradient>
    <pattern id="cityGateSetts" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#5f5b54"/>
      <rect x="0.6" y="0.6" width="8.8" height="3.2" rx="1.2" fill="#8a847a"/>
      <rect x="-4.4" y="4.6" width="8.8" height="3.0" rx="1.2" fill="#7d776d"/>
      <rect x="5.6" y="4.6" width="8.8" height="3.0" rx="1.2" fill="#7d776d"/>
    </pattern>
  </defs>

  <!-- the passage: cobbled setts, worn paler down the middle -->
  <rect x="50" y="0" width="60" height="80" fill="url(#cityGateSetts)"/>
  <rect x="68" y="0" width="24" height="80" fill="#b5ae9f" opacity="0.12"/>
  <!-- the portcullis slot across the passage, near the outer face -->
  <rect x="50" y="16" width="60" height="3" fill="#1c1b19" opacity="0.85"/>
  <g fill="#3a3c3f"><rect x="52" y="15" width="3" height="5"/><rect x="105" y="15" width="3" height="5"/></g>
  <!-- the oak gate leaves, swung open flat against the passage walls on the city side -->
  <g>
    <rect x="53" y="31.5" width="5" height="30" fill="#000000" opacity="0.3"/>
    <rect x="51.5" y="30" width="5" height="30" fill="#6a4a28" stroke="#2c1c0d" stroke-width="0.9"/>
    <rect x="103.5" y="30" width="5" height="30" fill="#6a4a28" stroke="#2c1c0d" stroke-width="0.9"/>
    <g fill="#2f3134"><rect x="51.5" y="34" width="5" height="2.2"/><rect x="51.5" y="53" width="5" height="2.2"/>
      <rect x="103.5" y="34" width="5" height="2.2"/><rect x="103.5" y="53" width="5" height="2.2"/></g>
    <rect x="52.5" y="31" width="1.2" height="28" fill="#9a7244" opacity="0.5"/>
    <rect x="104.5" y="31" width="1.2" height="28" fill="#9a7244" opacity="0.5"/>
  </g>
  <!-- the left tower's shadow across the passage -->
  <rect x="50" y="4" width="7" height="76" fill="#000000" opacity="0.28"/>

  <!-- the left tower: a crenellated parapet round a flagged top -->
  <rect x="0" y="0" width="50" height="80" fill="url(#cityGateLight)" stroke="#2a2824" stroke-width="1.6"/>
  <g fill="url(#cityGateMerlon)" stroke="#2a2824" stroke-width="0.8">
    <rect x="2" y="1.5" width="8" height="7"/>
    <rect x="14.5" y="1.5" width="8" height="7"/>
    <rect x="27" y="1.5" width="8" height="7"/>
    <rect x="39.5" y="1.5" width="8" height="7"/>
