<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" preserveAspectRatio="none">
  <!-- Placeholder gear contraption (plan-city-assets.md K6): TRUE top-down, a
       gnome machine of no obvious purpose. The viewBox is 120x120 to match
       the 2.4 x 2.4 rect body in api/props/gear-contraption.json
       (preserveAspectRatio=none, so the two must stay in sync); 50 units per
       metre. Solid.

       From above: a soot-dark iron bed plate riveted in brass, carrying a
       train of meshing gears (a big spoked brass wheel driving a copper
       pinion, a small brass gear and an iron one), a copper cylinder with its
       piston rod along the south edge, and a stubby stack in the south-east
       corner, ringed with soot. Each gear's shadow falls down-right. The
       clan's sigil is stamped on the bed plate. Gnome palette (R5): brass, copper, gears, soot;
       PO accent 2026-10-23: the clan's sigil, a brass cog with a spanner
       across it. -->
  <defs>
    <radialGradient id="gearContraptionSoot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#121110" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#121110" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gearContraptionCylinder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a070"/>
      <stop offset="0.45" stop-color="#b4643a"/>
      <stop offset="1" stop-color="#5e2e14"/>
    </linearGradient>
  </defs>

