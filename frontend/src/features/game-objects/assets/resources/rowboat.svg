<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" preserveAspectRatio="none">
  <!-- Placeholder rowboat: TRUE top-down, drawn up on the beach with the bow
       pointing EAST. The viewBox is 260x110 to match the 2.6 x 1.1 rect body
       in api/props/rowboat.json; collisionFactor 0.85 because the pointed bow
       leaves the rect's eastern corners empty.

       ⭐ A boat from above is its INSIDE: the thwarts (seats) across it and the
       oars shipped along them are what say boat rather than leaf or pod.
       ⚑ Painted, not tarred - the fishing hut owns the tar black, and the two
       sit side by side on the same strand. -->

  <!-- ground shadow -->
  <path d="M16,24 C80,12 170,12 214,28 C236,38 252,48 256,60 C252,72 236,84 214,94 C170,108 80,108 16,96 Q10,60 16,24 Z"
        fill="#000000" opacity="0.22"/>

  <!-- outer hull: white planking under a blue gunwale -->
  <path d="M8,16 C72,4 162,4 206,20 C228,30 246,42 252,55 C246,68 228,80 206,90 C162,106 72,106 8,94 Q2,55 8,16 Z"
        fill="#3d6e8a" stroke="#1c3442" stroke-width="5" stroke-linejoin="round"/>
  <path d="M16,24 C76,13 160,13 202,28 C222,37 236,46 240,55 C236,64 222,73 202,82 C160,97 76,97 16,86 Q11,55 16,24 Z"
        fill="#e4ddcb" stroke="#7a7262" stroke-width="2"/>
  <!-- inside: the bottom boards -->
  <path d="M24,32 C78,22 156,22 196,35 C214,42 224,49 228,55 C224,61 214,68 196,75 C156,88 78,88 24,78 Q20,55 24,32 Z"
        fill="#9a7550"/>
  <g stroke="#5c4128" stroke-width="2" opacity="0.7">
    <path d="M26,44 C90,36 170,38 214,48" fill="none"/>
    <path d="M26,66 C90,74 170,72 214,62" fill="none"/>
  </g>

  <!-- the transom at the stern -->
  <rect x="6" y="24" width="12" height="62" rx="3" fill="#7a5a3a" stroke="#2c1e10" stroke-width="3"/>

  <!-- thwarts -->
  <g fill="#b48c5e" stroke="#4a3220" stroke-width="3">
    <rect x="62" y="24" width="18" height="62" rx="2"/>
    <rect x="132" y="24" width="18" height="62" rx="2"/>
  </g>

  <!-- oars shipped, blades aft -->
  <g stroke-linecap="round">
    <line x1="40" y1="44" x2="198" y2="44" stroke="#4a3220" stroke-width="7"/>
    <line x1="40" y1="44" x2="198" y2="44" stroke="#c9a876" stroke-width="4"/>
    <line x1="40" y1="66" x2="198" y2="66" stroke="#4a3220" stroke-width="7"/>
    <line x1="40" y1="66" x2="198" y2="66" stroke="#c9a876" stroke-width="4"/>
  </g>
  <g fill="#c9a876" stroke="#4a3220" stroke-width="2.5">
    <rect x="26" y="38" width="30" height="12" rx="5"/>
    <rect x="26" y="60" width="30" height="12" rx="5"/>
  </g>

  <!-- a painted stripe on the bow, the boat's name in a stroke -->
  <path d="M214,24 C232,34 246,46 250,55" fill="none" stroke="#e4ddcb" stroke-width="2" opacity="0.8"/>
</svg>
