<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="none">
  <!-- Placeholder forge (plan-city-assets.md K6): TRUE top-down, the craft
       district's hearth. The viewBox is 200x160 to match the 2 x 1.6 rect
       body in api/props/forge.json (preserveAspectRatio=none, so the two must
       stay in sync); 100 units per metre. Solid. It emits light
       (lightFraction 0.35, #ff9040, flicker), which shows only in dark areas,
       so the drawing carries its own glow.

       From above: a hearth of soot-blackened brick with an iron rim riveted
       in brass, the coal bed glowing white-hot at its heart, a leather
       bellows on the west side with its brass nozzle in the fire, the round
       copper flue in the north-east corner, a coal scuttle in the south-east
       and the tongs left across the south rim. Gnome palette (R5): brass, copper, gears, soot. -->
  <defs>
    <pattern id="forgeBrick" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 H20 M0,10 H20 M10,0 V5 M0,5 V10 M20,5 V10" fill="none" stroke="#1e1410"
            stroke-width="1" opacity="0.7"/>
    </pattern>
    <radialGradient id="forgeCoals" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c0"/>
      <stop offset="0.3" stop-color="#ffc060"/>
      <stop offset="0.6" stop-color="#ff9040"/>
      <stop offset="0.85" stop-color="#a02810"/>
      <stop offset="1" stop-color="#2a1008"/>
    </radialGradient>
    <radialGradient id="forgeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb060" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="forgeSoot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#121110" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#121110" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow, offset down-right -->
  <rect x="7" y="7" width="193" height="153" fill="#000000" opacity="0.3"/>

  <!-- the brick hearth, lit from the top-left -->
  <rect x="2" y="2" width="190" height="150" rx="4" fill="#6a3e30" stroke="#1e1410" stroke-width="2"/>
  <rect x="2" y="2" width="190" height="150" rx="4" fill="url(#forgeBrick)"/>
  <rect x="4" y="4" width="186" height="3" fill="#a06a50" opacity="0.55"/>
  <rect x="4" y="4" width="3" height="146" fill="#a06a50" opacity="0.45"/>
  <rect x="4" y="146" width="186" height="4" fill="#000000" opacity="0.3"/>
  <!-- soot over the brick round the fire and the flue -->
  <ellipse cx="110" cy="78" rx="80" ry="64" fill="url(#forgeSoot)"/>

  <!-- the fire pit: an iron rim, brass rivets, the coal bed -->
  <rect x="62" y="38" width="92" height="78" rx="10" fill="#1a1b1d" stroke="#0d0c0b" stroke-width="1.5"/>
  <rect x="62" y="38" width="92" height="78" rx="10" fill="none" stroke="#3a3c3f" stroke-width="5"/>
  <path d="M66,52 A10,10 0 0,1 76,42 H140" fill="none" stroke="#8a8f96" stroke-width="1.2" opacity="0.6"/>
  <g fill="#c9a24a" stroke="#6e5520" stroke-width="0.4">
    <circle cx="72" cy="41" r="1.3"/><circle cx="108" cy="41" r="1.3"/><circle cx="144" cy="41" r="1.3"/>
    <circle cx="72" cy="113" r="1.3"/><circle cx="108" cy="113" r="1.3"/><circle cx="144" cy="113" r="1.3"/>
    <circle cx="65" cy="77" r="1.3"/><circle cx="151" cy="77" r="1.3"/>
  </g>
  <ellipse cx="108" cy="77" rx="40" ry="33" fill="url(#forgeCoals)"/>
  <!-- coal lumps, their edges lit by the fire -->
  <g fill="#2a1a14" stroke="#ff8030" stroke-width="0.8">
    <path d="M78,58 l6,-3 l5,4 l-3,5 l-7,0 Z"/><path d="M132,62 l7,-2 l3,6 l-5,4 l-6,-3 Z"/>
    <path d="M84,96 l6,-2 l4,5 l-4,4 l-7,-2 Z"/><path d="M126,92 l6,0 l3,5 l-6,4 l-4,-4 Z"/>
    <path d="M100,52 l5,-1 l3,4 l-4,3 l-5,-2 Z"/><path d="M140,80 l4,-3 l4,3 l-2,5 l-5,0 Z"/>
    <path d="M72,80 l5,-2 l3,4 l-3,4 l-5,-2 Z"/>
  </g>
  <ellipse cx="108" cy="77" rx="70" ry="56" fill="url(#forgeGlow)"/>

  <!-- the bellows on the west side, its brass nozzle in the fire -->
  <g>
    <path d="M10,62 L48,70 L48,86 L10,94 Z" fill="#000000" opacity="0.3" transform="translate(3 3)"/>
    <path d="M10,62 L48,70 L48,86 L10,94 Z" fill="#6a4a2a" stroke="#2c1c0d" stroke-width="1"/>
    <g fill="none" stroke="#3e2a16" stroke-width="1"><path d="M20,65 L20,91"/><path d="M30,67 L30,89"/><path d="M40,69 L40,87"/></g>
    <path d="M11,63 L47,71" fill="none" stroke="#9a7244" stroke-width="1.2" opacity="0.7"/>
    <rect x="4" y="70" width="8" height="16" rx="2" fill="#7a5a38" stroke="#2c1c0d" stroke-width="0.8"/>
    <rect x="48" y="74" width="22" height="8" fill="#c9a24a" stroke="#6e5520" stroke-width="0.8"/>
    <rect x="48" y="74.5" width="22" height="2" fill="#f0dc9a" opacity="0.6"/>
  </g>

  <!-- the copper flue in the north-east corner, soot round it -->
  <circle cx="172" cy="24" r="14" fill="#000000" opacity="0.35" transform="translate(4 4)"/>
  <circle cx="172" cy="24" r="14" fill="#b4643a" stroke="#5e2e14" stroke-width="1.2"/>
  <path d="M161,20 A12,12 0 0,1 168,13" fill="none" stroke="#e8a070" stroke-width="1.6" opacity="0.8"/>
  <circle cx="172" cy="24" r="9" fill="#0d0c0b"/>
  <circle cx="172" cy="24" r="14" fill="none" stroke="#c9a24a" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- the coal scuttle in the south-east corner -->
  <rect x="160" y="118" width="26" height="24" rx="3" fill="#000000" opacity="0.3" transform="translate(2.5 2.5)"/>
  <rect x="160" y="118" width="26" height="24" rx="3" fill="#3a3c3f" stroke="#1a1b1d" stroke-width="1"/>
  <rect x="163" y="121" width="20" height="18" rx="2" fill="#1a1414"/>
  <g fill="#2a2420"><circle cx="168" cy="127" r="3"/><circle cx="176" cy="131" r="3.4"/><circle cx="170" cy="134" r="2.6"/></g>
  <rect x="160" y="118" width="26" height="3" fill="#c9a24a" opacity="0.85"/>

  <!-- the tongs across the south rim -->
  <g stroke-linecap="round">
    <line x1="78" y1="131" x2="132" y2="124" stroke="#000000" stroke-width="3" opacity="0.3" transform="translate(2 2)"/>
    <line x1="78" y1="131" x2="132" y2="124" stroke="#3a3c3f" stroke-width="2.4"/>
    <line x1="78" y1="135" x2="132" y2="126" stroke="#3a3c3f" stroke-width="2.4"/>
    <line x1="79" y1="130.5" x2="130" y2="123.8" stroke="#8a8f96" stroke-width="0.8" opacity="0.7"/>
    <circle cx="128" cy="125" r="1.6" fill="#c9a24a"/>
  </g>
</svg>
