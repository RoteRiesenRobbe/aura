<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Placeholder CONIFER art — the SECOND tree silhouette (docs/art/assets.csv
       prop-tree-variant-2, the highest-value missing asset in the project:
       Tree is ~46 % of the props in world.json and there was exactly ONE
       drawing of it).

       ⭐ THE ONE RULE THIS ASSET HAS TO OBEY: it must differ in SILHOUETTE,
       not in colour. A second green ball tinted a different green is the same
       tree twice — the eye counts outlines long before it compares hues. So
       roundTree is a smooth circle and this is a SPIKED WHEEL, and the two are
       told apart at a glance even at minimap size.

       ⭐ WHY A SPIKED WHEEL IS THE RIGHT TOP-DOWN CONIFER. Straight down onto a
       spruce you see the whorls of drooping branch tips radiating from the
       apex, and nothing else — no trunk, no ground. That is a star, and the
       tiers of a cone stack as CONCENTRIC stars of shrinking radius, because
       the apex really is directly above the centre.
       ⚑ Which is why the tiers are NOT offset toward the light: nudging each
       one up-left is a plausible-sounding way to fake height and it draws a
       LEANING tree. The height cue has to come from shading instead, so the
       depth here is one radial gradient plus a shade crescent on the
       away-from-light rim.

       ⚑ COLDER AND DARKER than roundTree's #21790f. A conifer really is, and
       it doubles the separation for free once the silhouette has done the
       work. ⛔ But not so dark that it vanishes under the Canopy atmosphere
       (darkness 0.22) — these greens are picked to survive that, not to look
       best on a white page.

       Body r 0.9 against the round tree's 1.0 — a spruce is narrower than a
       broadleaf, and the size difference is a third free cue. The collider is
       half that (collisionFactor 0.5): it is the TRUNK, and a conifer's trunk
       is thin.

       ⚑ Generic prop, so no `treeSpot` decal under it (that belongs to the
       bespoke Tree class). The spot draws at 0.7 x the crown and is covered by
       it, so its absence does not show — see api/props/pine-tree.json.

       Circle body, square viewBox, so the SVG bake needs no
       `preserveAspectRatio` (see house.svg and a95a2f0d for when it does).
       Light from the top-left, like everything else here. -->

  <defs>
    <!-- the cone catching the light on its up-left flank -->
    <radialGradient id="pineLit" cx="0.36" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <!-- ground shadow, offset down-right -->
  <ellipse cx="109" cy="110" rx="86" ry="82" fill="#000000" opacity="0.28"/>

  <!-- ⭐ FOUR WHORLS, outermost first and darkest. Each star's phase is rolled
       on a little so the points of one tier do not stack on the points of the
       next — stacked points merge into long spokes and the tree reads as a
       cartwheel. -->
  <path d="M100.0,12.0 L109.0,37.6 L124.8,15.6 L126.2,42.7 L147.6,26.0 L141.3,52.4 L166.5,42.4 L153.0,65.9 L180.0,63.4 L160.4,82.3 L187.1,87.5 L163.0,100.0 L187.1,112.5 L160.4,117.7 L180.0,136.6 L153.0,134.1 L166.5,157.6 L141.3,147.6 L147.6,174.0 L126.2,157.3 L124.8,184.4 L109.0,162.4 L100.0,188.0 L91.0,162.4 L75.2,184.4 L73.8,157.3 L52.4,174.0 L58.7,147.6 L33.5,157.6 L47.0,134.1 L20.0,136.6 L39.6,117.7 L12.9,112.5 L37.0,100.0 L12.9,87.5 L39.6,82.3 L20.0,63.4 L47.0,65.9 L33.5,42.4 L58.7,52.4 L52.4,26.0 L73.8,42.7 L75.2,15.6 L91.0,37.6 Z"
        fill="#143d26" stroke="#0d2a19" stroke-width="1.6" stroke-linejoin="round"/>

  <path d="M106.4,29.3 L113.1,51.7 L130.2,35.7 L128.8,59.1 L150.3,49.9 L141.0,71.4 L164.4,70.2 L148.3,87.2 L170.7,94.0 L149.8,104.5 L168.5,118.6 L145.3,121.3 L158.0,140.9 L135.3,135.5 L140.6,158.3 L121.0,145.4 L118.2,168.6 L104.2,149.8 L93.6,170.7 L86.9,148.3 L69.8,164.3 L71.2,140.9 L49.7,150.1 L59.0,128.6 L35.6,129.8 L51.7,112.8 L29.3,106.0 L50.2,95.5 L31.5,81.4 L54.7,78.7 L42.0,59.1 L64.7,64.5 L59.4,41.7 L79.0,54.6 L81.8,31.4 L95.8,50.2 Z"
        fill="#1b5230" stroke="#0f3320" stroke-width="1.3" stroke-linejoin="round"/>

  <path d="M110.5,48.1 L114.8,67.2 L132.0,57.8 L127.6,76.9 L147.2,75.8 L134.9,91.1 L153.0,98.7 L135.3,107.2 L148.3,121.8 L128.7,121.8 L134.0,140.6 L116.4,132.0 L113.1,151.4 L100.9,136.0 L89.5,151.9 L85.2,132.8 L68.0,142.2 L72.4,123.1 L52.8,124.2 L65.1,108.9 L47.0,101.3 L64.7,92.8 L51.7,78.2 L71.3,78.2 L66.0,59.4 L83.6,68.0 L86.9,48.6 L99.1,64.0 Z"
        fill="#23663b" stroke="#12391f" stroke-width="1.1" stroke-linejoin="round"/>

  <path d="M110.7,66.7 L112.9,82.1 L128.2,79.3 L120.9,93.1 L135.0,99.9 L121.0,106.7 L128.4,120.5 L113.0,117.7 L111.0,133.2 L100.1,122.0 L89.3,133.3 L87.1,117.9 L71.8,120.7 L79.1,106.9 L65.0,100.1 L79.0,93.3 L71.6,79.5 L87.0,82.3 L89.0,66.8 L99.9,78.0 Z"
        fill="#2d7a47" stroke="#164226" stroke-width="1" stroke-linejoin="round"/>

  <!-- ⭐ THE APEX. A conifer's leader is the single highest point of the whole
       tree, so from above it is the one thing in full light — and a bright dot
       dead centre is also what tells the eye where the cone's axis is. -->
  <circle cx="99" cy="99" r="11" fill="#38904f"/>
  <circle cx="97.5" cy="97.5" r="5.5" fill="#4aa862"/>
  <circle cx="96.5" cy="96.5" r="2.4" fill="#63c079"/>

  <!-- depth: lit up-left, falling away down-right -->
  <circle cx="100" cy="100" r="88" fill="url(#pineLit)"/>
  <!-- and a hard shade crescent on the away rim, which is what stops the
       gradient alone reading as a flat vignette -->
  <path d="M100,188 A88,88 0 0,0 188,100" fill="none" stroke="#0b2417"
        stroke-width="15" opacity="0.30"/>
</svg>
