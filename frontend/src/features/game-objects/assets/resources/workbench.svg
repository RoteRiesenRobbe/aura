<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" preserveAspectRatio="none">
  <!-- Placeholder workbench (plan-city-assets.md K6): TRUE top-down, a gnome
       tinkerer's bench. The viewBox is 220x100 to match the 2.2 x 1 rect body
       in api/props/workbench.json (preserveAspectRatio=none, so the two must
       stay in sync); 100 units per metre. Solid.

       From above: a thick oak top, planks running east-west, scorched and
       oil-stained, brass corner plates. An iron vice is bolted to the west
       end with a part still in its jaws; a blueprint is pinned in the middle
       under a gear and an oil can; brass and copper gears, a spring and a
       spanner lie where they were dropped; a magnifier on a jointed brass arm
       leans over the work. Gnome palette (R5): brass, copper, gears, soot;
       PO accent 2026-10-23: the clan's sigil, a brass cog with a spanner
       across it. -->
  <defs>
    <linearGradient id="workbenchPrint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7398"/>
      <stop offset="1" stop-color="#36536f"/>
    </linearGradient>
    <radialGradient id="workbenchLens" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#cfe0e6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f98a0" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

