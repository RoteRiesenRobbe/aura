<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 70" preserveAspectRatio="none">
  <!-- Placeholder FALLEN LOG art (docs/art/assets.csv prop-fallen-log).

       ⛔ `preserveAspectRatio="none"` IS MANDATORY HERE and is not a style
       choice: Preloading.registerGameObjectSVG bakes every prop into a SQUARE
       texture, so the default `xMidYMid meet` letterboxes a 240x70 viewBox and
       SimpleProp.initShape then stretches that square back out to the body
       aspect — which squashes the art. It is invisible in Chromium and plain
       to see in Firefox. See the PO's fix a95a2f0d and house.svg.

       ⭐ WHAT MAKES IT A LOG RATHER THAN A BEAM IS THE TWO ENDS, and they must
       not match. One end is SAWN — a flat disc of end grain with rings — and
       the other is TORN, splintered where the trunk finally gave. A log with
       two identical ends is milled timber, which is a different object with a
       different story. ⚑ The sawn end also makes this the natural partner of
       stump.svg: the stump is the bottom of the cut and this is the top of it.

       ⭐ A CYLINDER IS SHADED ALONG ITS LENGTH, not around a centre. The bark
       runs as three bands — lit along the up-light edge, mid across the
       crown, dark along the away edge — and the longitudinal ridges follow
       them. Everything else here (knots, moss, the broken end) sits on top of
       that gradient, because getting the barrel wrong is the one mistake no
       amount of texture recovers from.

       ⚑ RECT BODY, SO IT TURNS (plan-prop-scale.md C2b): the authored
       rotation turns the collider with the sprite, which is what a log wants
       — it should be able to lie across a lane at any angle. ⛔ The cost is
       the same trade cart.svg and barn.svg take knowingly: the BAKED SHADOW
       TURNS TOO, so a log rotated 180 degrees is lit from the bottom-right.
       Accepted; the alternative is no shadow, and a log with no shadow lies
       IN the ground rather than on it.

       ⚑ Blocking by definition, like every prop that is not explicitly a gap.
       A log you can walk through reads as a painted decal. A placement that
       wants a pure landmark can turn it off per placement (zone.go Prop's
       tri-state `blocksMovement`).

       Body 2.4 x 0.7 units. Light from the top-left. -->

  <defs>
    <!-- the barrel: lit along the top edge, dark along the bottom -->
    <linearGradient id="logBarrel" x1="0" y1="10" x2="0" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a7050"/>
      <stop offset="0.28" stop-color="#6e5739"/>
      <stop offset="0.72" stop-color="#53412a"/>
      <stop offset="1" stop-color="#3a2d1d"/>
    </linearGradient>
    <!-- the sawn face, lit from its up-left corner -->
    <radialGradient id="logFace" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#cfae77"/>
      <stop offset="1" stop-color="#a1844f"/>
    </radialGradient>
  </defs>

  <!-- ground shadow, offset down-right. ⚑ Drawn as a rounded bar rather than
       an ellipse: the shadow of a cylinder is a cylinder's footprint. -->
  <rect x="12" y="20" width="222" height="44" rx="22" fill="#000000" opacity="0.26"/>

  <!-- THE TRUNK -->
  <rect x="6" y="12" width="218" height="44" rx="21" fill="url(#logBarrel)"
        stroke="#2b2116" stroke-width="2.4"/>

  <!-- longitudinal bark ridges. ⚑ They run the LENGTH and never across it:
       one cross-band and a log becomes a rolled carpet. Unequal spacing,
       because bark is not corduroy. -->
  <g stroke="#3d2f1f" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M22,22 L96,21 L152,23 L212,22" stroke-width="2"/>
    <path d="M18,30 L84,31 L148,29 L216,30" stroke-width="1.6"/>
    <path d="M24,38 L100,39 L166,37 L210,38" stroke-width="2.2"/>
    <path d="M20,46 L92,45 L158,47 L214,46" stroke-width="1.8"/>
    <path d="M30,52 L110,53 L180,51" stroke-width="1.4"/>
  </g>
  <!-- and the lit ones, on the up-light flank only -->
  <g stroke="#a38a63" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M26,18 L104,17 L176,19 L208,18" stroke-width="2"/>
    <path d="M34,25 L118,26 L188,24" stroke-width="1.4"/>
  </g>

  <!-- two knots where branches came off. ⚑ Drawn as ellipses FLATTENED across
       the log, because a round knot on a curved surface is seen obliquely —
       a circle here reads as a bolt head. -->
  <g stroke="#31261a" stroke-width="2">
    <ellipse cx="88" cy="33" rx="11" ry="7.5" fill="#5c4830"/>
    <ellipse cx="88" cy="33" rx="5" ry="3.2" fill="#3a2d1d"/>
    <ellipse cx="166" cy="41" rx="8" ry="5.4" fill="#57452d"/>
    <ellipse cx="166" cy="41" rx="3.4" ry="2.2" fill="#37291b"/>
  </g>
  <!-- a branch stub still attached, sticking out over the grass -->
  <path d="M132,16 L142,4 L152,7 L142,19 Z" fill="#6a5539" stroke="#2b2116"
        stroke-width="2" stroke-linejoin="round"/>

  <!-- ⭐ THE SAWN END, west. A disc of end grain: rings off-centre (a trunk
       grows faster on its lit side, and concentric rings read as a machined
       target — the same note stump.svg carries), with drying checks. -->
  <ellipse cx="20" cy="34" rx="13" ry="21" fill="url(#logFace)"
           stroke="#4a3a22" stroke-width="2.6"/>
  <g fill="none" stroke="#8a6f43" stroke-width="1.5" opacity="0.8">
    <ellipse cx="19" cy="32" rx="9.5" ry="15.5"/>
    <ellipse cx="19" cy="32" rx="6.2" ry="10"/>
    <ellipse cx="19" cy="32" rx="3" ry="4.8"/>
  </g>
  <g stroke="#6b5231" stroke-width="1.6" stroke-linecap="round">
    <path d="M19,32 L14,16"/>
    <path d="M19,32 L28,44"/>
  </g>

  <!-- ⭐ THE TORN END, east. Splinters of pale exposed wood standing out past
       where the bark stops — hard, irregular spikes that nothing sawn makes.
       This is the half of the silhouette that says the tree BROKE. -->
  <path d="M212,14 L232,20 L224,27 L238,31 L222,36 L236,44 L218,47 L228,56 L210,55 Z"
        fill="#b2925c" stroke="#4a3a22" stroke-width="2.2" stroke-linejoin="round"/>
  <g stroke="#7b6138" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M213,20 L228,23"/>
    <path d="M213,30 L231,32"/>
    <path d="M213,40 L229,44"/>
    <path d="M213,49 L223,52"/>
  </g>

  <!-- moss on the shaded flank — a log on the forest floor is damp underneath
       and this is the cheapest cue that it has been lying here a while -->
  <g fill="#4f6b36" opacity="0.6">
    <ellipse cx="62" cy="50" rx="19" ry="6.5" transform="rotate(-3 62 50)"/>
    <ellipse cx="120" cy="52" rx="14" ry="5" transform="rotate(2 120 52)"/>
    <ellipse cx="192" cy="49" rx="16" ry="5.6" transform="rotate(-2 192 49)"/>
  </g>
</svg>
