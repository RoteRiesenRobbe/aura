<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" preserveAspectRatio="none">
  <!-- Placeholder fishing hut: TRUE top-down, a gable shed with the ridge
       running east-west. The viewBox is 300x240 to match the 3.0 x 2.4 rect
       body in api/props/fishing-hut.json.

       ⭐ MATERIAL FIRST, the cottage's rule: the house is red TILE, the cottage
       gold THATCH, and this is TARRED FELT on boards - near-black, with lighter
       battens holding it down every half metre. Three buildings, three
       materials, no two confusable from across the strand.
       ⚑ Dark on purpose: it stands on pale sand and pale coast grass, where a
       black roof is the most visible thing on the shore. The north slope is
       lifted a step so the ridge still reads.
       ⭐ The fisherman's kit is on the roof - a net heaped over the eave and
       glass floats - because from straight above the roof is all you see. -->

  <!-- ground shadow -->
  <rect x="26" y="26" width="270" height="208" rx="4" fill="#000000" opacity="0.24"/>

  <!-- north slope, the lit one -->
  <path d="M8,10 L292,10 L292,120 L8,120 Z" fill="#3e3f43" stroke="#121214" stroke-width="5" stroke-linejoin="round"/>
  <!-- south slope -->
  <path d="M8,120 L292,120 L292,230 L8,230 Z" fill="#26272a" stroke="#121214" stroke-width="5" stroke-linejoin="round"/>

  <!-- battens, running down each slope -->
  <g stroke="#55565b" stroke-width="5" opacity="0.9">
    <line x1="48" y1="14" x2="48" y2="116"/>
    <line x1="98" y1="14" x2="98" y2="116"/>
    <line x1="148" y1="14" x2="148" y2="116"/>
    <line x1="198" y1="14" x2="198" y2="116"/>
    <line x1="248" y1="14" x2="248" y2="116"/>
  </g>
  <g stroke="#3a3b3f" stroke-width="5" opacity="0.9">
    <line x1="48" y1="124" x2="48" y2="226"/>
    <line x1="98" y1="124" x2="98" y2="226"/>
    <line x1="148" y1="124" x2="148" y2="226"/>
    <line x1="198" y1="124" x2="198" y2="226"/>
    <line x1="248" y1="124" x2="248" y2="226"/>
  </g>

  <!-- the ridge board -->
  <rect x="4" y="113" width="292" height="14" rx="3" fill="#5a4a36" stroke="#1e1810" stroke-width="3"/>

  <!-- a tin stovepipe through the south slope -->
  <circle cx="226" cy="170" r="12" fill="#6b6b70" stroke="#1e1e22" stroke-width="3"/>
  <circle cx="226" cy="170" r="6" fill="#141416"/>
  <ellipse cx="236" cy="190" rx="16" ry="8" fill="#141416" opacity="0.35"/>

  <!-- ⭐ a net heaped over the west eave -->
  <defs>
    <pattern id="hutmesh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0,0 L9,0 M0,0 L0,9" stroke="#8f8a5c" stroke-width="1.6" fill="none"/>
    </pattern>
  </defs>
  <path d="M4,140 C30,128 60,140 72,156 C84,176 70,200 44,206 C24,212 6,204 4,196 Z" fill="#6c6a48" opacity="0.6"/>
  <path d="M4,140 C30,128 60,140 72,156 C84,176 70,200 44,206 C24,212 6,204 4,196 Z" fill="url(#hutmesh)" stroke="#4a4830" stroke-width="2"/>
  <g fill="#c99a5a" stroke="#5a3e1c" stroke-width="1.2">
    <ellipse cx="28" cy="138" rx="5" ry="3.5"/>
    <ellipse cx="54" cy="142" rx="5" ry="3.5"/>
    <ellipse cx="70" cy="166" rx="5" ry="3.5"/>
  </g>

  <!-- glass floats in their rope cradles on the north slope -->
  <g stroke="#1d3a33" stroke-width="2">
    <circle cx="176" cy="58" r="10" fill="#5f9c8a"/>
    <circle cx="198" cy="66" r="8" fill="#4d8a7a"/>
  </g>
  <g fill="#c4e0d4" opacity="0.8">
    <circle cx="172" cy="54" r="3"/>
    <circle cx="195" cy="63" r="2.5"/>
  </g>
</svg>
