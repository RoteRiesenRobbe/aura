<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" preserveAspectRatio="none">
  <!-- Placeholder market counter (plan-city-assets.md K1): TRUE top-down, the
       plank top of a trestle counter with the day's goods on it. The viewBox
       is 260x80 to match the 2.6 x 0.8 rect body in
       api/props/market-counter.json (preserveAspectRatio=none, so the two must
       stay in sync). It sits under a MarketStallRoof and is the solid half of
       the stall: what you see once the awning fades.

       Goods are kept small and few, so the counter stays a counter and the
       produce never reads as a separate prop: two baskets, a cloth bundle and
       a set of scales. -->

  <!-- ground shadow, offset down-right -->
  <rect x="8" y="10" width="250" height="68" rx="3" fill="#000000" opacity="0.24"/>

  <!-- the plank top -->
  <rect x="4" y="4" width="248" height="68" rx="3" fill="#8a6234" stroke="#432c14" stroke-width="4"/>
  <!-- three boards running the length, with dark gaps -->
  <g stroke="#432c14" stroke-width="2.5" opacity="0.8">
    <line x1="6" y1="27" x2="250" y2="27"/>
    <line x1="6" y1="50" x2="250" y2="50"/>
  </g>
  <rect x="8" y="8" width="240" height="16" fill="#a3763f" opacity="0.5"/>
  <rect x="8" y="30" width="240" height="17" fill="#a3763f" opacity="0.3"/>
  <!-- board ends and the nails holding them to the trestles -->
  <g fill="#2f2e2b" opacity="0.75">
    <circle cx="20" cy="16" r="2"/><circle cx="20" cy="39" r="2"/><circle cx="20" cy="61" r="2"/>
    <circle cx="236" cy="16" r="2"/><circle cx="236" cy="39" r="2"/><circle cx="236" cy="61" r="2"/>
  </g>
  <!-- a knot and a long split: the counter has stood in the rain -->
  <ellipse cx="120" cy="60" rx="5" ry="3" fill="#5a3c1c" opacity="0.6"/>
  <path d="M150,12 L176,14 L198,11" fill="none" stroke="#432c14" stroke-width="1.5" opacity="0.5"/>

  <!-- a basket of apples -->
  <circle cx="44" cy="38" r="20" fill="#5a3c1c" opacity="0.35" transform="translate(3 3)"/>
  <circle cx="44" cy="38" r="20" fill="#9b7a45" stroke="#4a3418" stroke-width="3"/>
  <circle cx="44" cy="38" r="14" fill="#6b4c2a"/>
  <g stroke="#3a2a14" stroke-width="0.9">
    <circle cx="38" cy="33" r="5" fill="#a8362a"/>
    <circle cx="49" cy="32" r="5" fill="#b8452f"/>
    <circle cx="44" cy="42" r="5" fill="#962f25"/>
    <circle cx="36" cy="43" r="4.5" fill="#b8452f"/>
    <circle cx="52" cy="43" r="4.5" fill="#a8362a"/>
  </g>
  <circle cx="37" cy="31" r="1.6" fill="#ffffff" opacity="0.35"/>

  <!-- a basket of turnips -->
  <circle cx="96" cy="38" r="18" fill="#5a3c1c" opacity="0.35" transform="translate(3 3)"/>
  <circle cx="96" cy="38" r="18" fill="#9b7a45" stroke="#4a3418" stroke-width="3"/>
  <circle cx="96" cy="38" r="12" fill="#6b4c2a"/>
  <g stroke="#5a4a50" stroke-width="0.9">
    <circle cx="91" cy="34" r="4.5" fill="#d9cfd6"/>
    <circle cx="101" cy="35" r="4.5" fill="#cbb6c6"/>
    <circle cx="95" cy="43" r="4.5" fill="#d9cfd6"/>
  </g>
  <g stroke="#5c7a3a" stroke-width="1.6" stroke-linecap="round">
    <line x1="91" y1="30" x2="88" y2="25"/>
    <line x1="101" y1="31" x2="104" y2="26"/>
  </g>

  <!-- a folded cloth bundle -->
  <rect x="146" y="22" width="40" height="32" rx="3" fill="#000000" opacity="0.2" transform="translate(3 3)"/>
  <rect x="146" y="22" width="40" height="32" rx="3" fill="#6f7f8c" stroke="#38424b" stroke-width="2.5"/>
  <line x1="148" y1="38" x2="184" y2="38" stroke="#38424b" stroke-width="1.5" opacity="0.7"/>
  <rect x="148" y="24" width="36" height="6" fill="#ffffff" opacity="0.15"/>

  <!-- the scales: a beam and two pans, the merchant's end of the counter -->
  <circle cx="212" cy="26" r="9" fill="#8a7a4a" stroke="#4a3e1e" stroke-width="2"/>
  <circle cx="212" cy="52" r="9" fill="#8a7a4a" stroke="#4a3e1e" stroke-width="2"/>
  <line x1="212" y1="26" x2="212" y2="52" stroke="#3a2f16" stroke-width="3" stroke-linecap="round"/>
  <circle cx="212" cy="39" r="3" fill="#3a2f16"/>
  <circle cx="209" cy="23" r="2" fill="#ffffff" opacity="0.3"/>
</svg>
