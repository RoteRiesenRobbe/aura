<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Placeholder barrel (city market clutter): TRUE top-down, an oak cask
       standing on end. Straight overhead shows the head (the lid) inside the
       chime hoop, and round it the staves' bulging sides, wider than the head,
       banded by the belly hoop. Circle body (api/props/barrel.json, r 0.4).
       Market palette: weathered, worn, not festive. -->

  <defs>
    <!-- the belly catches the light on its top-left side -->
    <radialGradient id="barrel-belly" cx="38%" cy="36%" r="62%">
      <stop offset="0" stop-color="#9a7448"/>
      <stop offset="0.7" stop-color="#7a5732"/>
      <stop offset="1" stop-color="#553a1f"/>
    </radialGradient>
    <clipPath id="barrel-head">
      <circle cx="50" cy="50" r="29"/>
    </clipPath>
  </defs>

  <!-- ground shadow, offset down-right -->
  <circle cx="53" cy="54" r="45" fill="#000000" opacity="0.24"/>

  <!-- the staves' bulging sides -->
  <circle cx="50" cy="50" r="45" fill="url(#barrel-belly)" stroke="#33220f" stroke-width="3"/>
  <!-- the joints between the sixteen staves, from the chime out to the belly -->
  <g stroke="#3b2812" stroke-width="1.4" opacity="0.7">
    <line x1="50" y1="16" x2="50" y2="6"/>
    <line x1="63" y1="18.6" x2="66.8" y2="9.4"/>
    <line x1="74" y1="26" x2="81.1" y2="18.9"/>
    <line x1="81.4" y1="37" x2="90.6" y2="33.2"/>
    <line x1="84" y1="50" x2="94" y2="50"/>
    <line x1="81.4" y1="63" x2="90.6" y2="66.8"/>
    <line x1="74" y1="74" x2="81.1" y2="81.1"/>
    <line x1="63" y1="81.4" x2="66.8" y2="90.6"/>
    <line x1="50" y1="84" x2="50" y2="94"/>
    <line x1="37" y1="81.4" x2="33.2" y2="90.6"/>
    <line x1="26" y1="74" x2="18.9" y2="81.1"/>
    <line x1="18.6" y1="63" x2="9.4" y2="66.8"/>
    <line x1="16" y1="50" x2="6" y2="50"/>
    <line x1="18.6" y1="37" x2="9.4" y2="33.2"/>
    <line x1="26" y1="26" x2="18.9" y2="18.9"/>
    <line x1="37" y1="18.6" x2="33.2" y2="9.4"/>
  </g>

  <!-- the belly hoop, near the widest point, its lit edge top-left -->
  <circle cx="50" cy="50" r="40.5" fill="none" stroke="#45443f" stroke-width="4"/>
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="#8b8a85" stroke-width="1"
          stroke-dasharray="70 190" stroke-dashoffset="150" opacity="0.8"/>
  <!-- a rust streak where the hoop has wept onto the wood -->
  <path d="M74,80 L77,86" stroke="#7a3d1c" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- the chime: the staves' end grain standing proud round the head -->
  <circle cx="50" cy="50" r="33" fill="#8a6a44" stroke="#33220f" stroke-width="1.5"/>
  <!-- and the chime hoop over it -->
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#45443f" stroke-width="3"/>
  <circle cx="50" cy="50" r="34.5" fill="none" stroke="#8b8a85" stroke-width="0.8"
          stroke-dasharray="55 162" stroke-dashoffset="118" opacity="0.8"/>

  <!-- the head, sunk a little inside the chime: four boards across -->
  <circle cx="50" cy="50" r="29.5" fill="#6e5032" stroke="#33220f" stroke-width="1.5"/>
  <g clip-path="url(#barrel-head)">
    <!-- the head's inner shadow under the chime's lit (top-left) side -->
    <circle cx="51.5" cy="52" r="29" fill="none" stroke="#000000" stroke-width="4" opacity="0.18"/>
    <!-- board faces, the lit one top-left -->
    <rect x="18" y="20" width="64" height="14" fill="#8e6c45" opacity="0.5"/>
    <rect x="18" y="35" width="64" height="14" fill="#8e6c45" opacity="0.32"/>
    <rect x="18" y="50" width="64" height="14" fill="#8e6c45" opacity="0.2"/>
    <!-- the joints -->
    <g stroke="#33220f" stroke-width="1.3" opacity="0.8">
      <line x1="18" y1="34.5" x2="82" y2="34.5"/>
      <line x1="18" y1="49.5" x2="82" y2="49.5"/>
      <line x1="18" y1="64.5" x2="82" y2="64.5"/>
    </g>
    <!-- a wet ring where a mug or a jug stood -->
    <circle cx="61" cy="59" r="7" fill="none" stroke="#3b2812" stroke-width="1.4" opacity="0.4"/>
    <!-- grain -->
    <path d="M26,28 Q40,26 52,29 T76,28" fill="none" stroke="#3b2812" stroke-width="0.8" opacity="0.35"/>
    <path d="M24,57 Q36,55 48,58" fill="none" stroke="#3b2812" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- the bung, stopped with a wooden plug -->
  <circle cx="40" cy="42" r="4.2" fill="#2b1c0c"/>
  <circle cx="39.6" cy="41.6" r="3" fill="#a1835a" stroke="#4a3418" stroke-width="0.8"/>
</svg>
