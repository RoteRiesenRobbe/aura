<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- Placeholder watchtower (plan-city-assets.md K5): TRUE top-down, the
       tower seen from straight above. The viewBox is 100x100 to match the
       4 x 4 rect body in api/props/watchtower.json (preserveAspectRatio=none,
       so the two must stay in sync); 25 units per metre. SOLID, not a roof:
       nobody goes in from the street, and it never fades, like the
       cathedral's bell tower.

       An OPEN fighting platform, so the watch post is what you see: a
       crenellated parapet of dark stone with iron-capped corner turrets, an
       oak plank floor, the trapdoor the ladder comes up through, a
       bolt-thrower on its swivel looking north-east over the wall, a rack of
       bolts, and the clan's red flag with the brass anvil on it, flying from
       a pole in the south-east corner. Iron fittings everywhere, riveted in
       brass. Its shadow falls far down-right: it is tall. Dwarven palette
       (R5): dark stone, iron, red banners; PO accent 2026-10-23: brass
       rivets and the clan's anvil sigil. -->

  <!-- ground shadow, long, offset down-right -->
  <rect x="11" y="11" width="89" height="89" fill="#000000" opacity="0.3"/>

  <!-- the parapet: dark stone, lit from the top-left -->
  <rect x="2" y="2" width="86" height="86" fill="#55524d" stroke="#24221f" stroke-width="1.6"/>
  <rect x="3" y="3" width="84" height="2" fill="#8a867e" opacity="0.6"/>
  <rect x="3" y="3" width="2" height="84" fill="#8a867e" opacity="0.45"/>
  <rect x="3" y="85" width="84" height="2" fill="#2e2c29" opacity="0.6"/>
  <rect x="85" y="3" width="2" height="84" fill="#2e2c29" opacity="0.6"/>
  <!-- the crenels -->
  <g fill="#24221f" opacity="0.75">
    <rect x="24" y="2" width="6" height="6"/><rect x="42" y="2" width="6" height="6"/>
    <rect x="60" y="2" width="6" height="6"/>
    <rect x="24" y="82" width="6" height="6"/><rect x="42" y="82" width="6" height="6"/>
    <rect x="60" y="82" width="6" height="6"/>
    <rect x="2" y="24" width="6" height="6"/><rect x="2" y="42" width="6" height="6"/>
    <rect x="2" y="60" width="6" height="6"/>
    <rect x="82" y="24" width="6" height="6"/><rect x="82" y="42" width="6" height="6"/>
    <rect x="82" y="60" width="6" height="6"/>
  </g>

  <!-- the oak floor, planks running north-south, the parapet's inner shadow -->
  <rect x="8" y="8" width="74" height="74" fill="#6b5034" stroke="#2c1c0d" stroke-width="1"/>
  <g stroke="#2c1c0d" stroke-width="0.7" opacity="0.6">
    <line x1="17" y1="8" x2="17" y2="82"/><line x1="26" y1="8" x2="26" y2="82"/>
    <line x1="35" y1="8" x2="35" y2="82"/><line x1="44" y1="8" x2="44" y2="82"/>
    <line x1="53" y1="8" x2="53" y2="82"/><line x1="62" y1="8" x2="62" y2="82"/>
    <line x1="71" y1="8" x2="71" y2="82"/>
  </g>
  <g fill="#8a6a44" opacity="0.4">
    <rect x="27" y="20" width="7" height="20"/><rect x="54" y="48" width="7" height="24"/>
  </g>
  <path d="M8,8 L82,8 L82,12 L12,12 L12,82 L8,82 Z" fill="#000000" opacity="0.3"/>

  <!-- the trapdoor in the south-west corner, iron-strapped -->
  <rect x="14" y="60" width="18" height="16" fill="#000000" opacity="0.3" transform="translate(1.5 1.5)"/>
  <rect x="14" y="60" width="18" height="16" fill="#5a3f22" stroke="#2c1c0d" stroke-width="1"/>
  <g fill="#2f3134"><rect x="14" y="63" width="18" height="2"/><rect x="14" y="71" width="18" height="2"/></g>
  <g fill="#c9a24a"><circle cx="17" cy="64" r="0.9"/><circle cx="29" cy="64" r="0.9"/>
    <circle cx="17" cy="72" r="0.9"/><circle cx="29" cy="72" r="0.9"/></g>
  <circle cx="23" cy="68" r="1.8" fill="none" stroke="#2f3134" stroke-width="1"/>

  <!-- a rack of bolts against the north wall -->
  <rect x="14" y="14" width="20" height="7" fill="#000000" opacity="0.3" transform="translate(1.5 1.5)"/>
  <rect x="14" y="14" width="20" height="7" fill="#4a3018" stroke="#2c1c0d" stroke-width="0.8"/>
  <g stroke="#3a3c3f" stroke-width="1.2" stroke-linecap="round">
    <line x1="16.5" y1="16" x2="16.5" y2="19"/><line x1="19.5" y1="16" x2="19.5" y2="19"/>
    <line x1="22.5" y1="16" x2="22.5" y2="19"/><line x1="25.5" y1="16" x2="25.5" y2="19"/>
    <line x1="28.5" y1="16" x2="28.5" y2="19"/><line x1="31.5" y1="16" x2="31.5" y2="19"/>
  </g>

  <!-- the bolt-thrower on its swivel, aimed north-east over the parapet:
       an iron-shod stock, the bow across it, the string drawn back -->
  <g transform="translate(2.5 2.5) rotate(45 44 44)">
    <rect x="40" y="18" width="8" height="40" fill="#000000" opacity="0.35"/>
    <path d="M28,32 Q44,24 60,32" fill="none" stroke="#000000" stroke-width="4" opacity="0.3"/>
  </g>
  <g transform="rotate(45 44 44)">
    <rect x="40" y="18" width="8" height="40" rx="1" fill="#6a4a28" stroke="#2c1c0d" stroke-width="1"/>
    <rect x="41" y="19" width="2" height="38" fill="#9a7244" opacity="0.55"/>
    <rect x="40" y="18" width="8" height="5" fill="#2f3134"/>
    <path d="M28,32 Q44,24 60,32" fill="none" stroke="#2f3134" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M28,32 L44,44 L60,32" fill="none" stroke="#c8b98a" stroke-width="0.8"/>
    <line x1="44" y1="14" x2="44" y2="44" stroke="#3a3c3f" stroke-width="1.4"/>
    <g fill="#c9a24a" stroke="#6e5520" stroke-width="0.4">
      <circle cx="42" cy="20.5" r="0.9"/><circle cx="46" cy="20.5" r="0.9"/>
    </g>
  </g>
  <!-- the swivel's iron pivot, brass-capped -->
  <circle cx="44" cy="44" r="4" fill="#2f3134" stroke="#1a1b1d" stroke-width="0.8"/>
  <circle cx="44" cy="44" r="1.6" fill="#c9a24a"/>

  <!-- the flag, flying west from its pole in the south-east corner -->
  <g>
    <path d="M48,68 L76,68 L76,82 L48,82 L54,75 Z" fill="#000000" opacity="0.3" transform="translate(2.5 2.5)"/>
    <path d="M48,68 L76,68 L76,82 L48,82 L54,75 Z" fill="#9a2a24" stroke="#4e1210" stroke-width="1"/>
    <path d="M62,68 Q66,75 62,82" fill="none" stroke="#6e1b17" stroke-width="2" opacity="0.7"/>
    <rect x="48" y="68.5" width="28" height="1.5" fill="#c9a24a" opacity="0.8"/>
    <rect x="48" y="80" width="28" height="1.5" fill="#c9a24a" opacity="0.8"/>
    <path d="M0,1.5 Q3,0 5,0 H20 V3 H16 Q14,4 14,7 V9 L18,12 V14 H6 V12 L10,9 V7 Q10,4 7,3 H5 Q2,3 0,1.5 Z"
          fill="#c9a24a" stroke="#6e5520" stroke-width="0.4" transform="translate(64 71) scale(0.5)"/>
    <circle cx="77" cy="75" r="2.6" fill="#2f3134" stroke="#1a1b1d" stroke-width="0.6"/>
    <circle cx="76.4" cy="74.4" r="1.2" fill="#c9a24a"/>
  </g>

  <!-- the corner turrets, iron-capped, riveted in brass -->
  <g>
    <rect x="1" y="1" width="10" height="10" fill="#000000" opacity="0.3" transform="translate(2.5 2.5)"/>
    <rect x="1" y="1" width="10" height="10" fill="#2f3134" stroke="#1a1b1d" stroke-width="1"/>
    <rect x="2" y="2" width="8" height="2" fill="#8a8f96" opacity="0.55"/>
    <rect x="79" y="1" width="10" height="10" fill="#000000" opacity="0.3" transform="translate(2.5 2.5)"/>
    <rect x="79" y="1" width="10" height="10" fill="#2f3134" stroke="#1a1b1d" stroke-width="1"/>
    <rect x="80" y="2" width="8" height="2" fill="#8a8f96" opacity="0.55"/>
    <rect x="1" y="79" width="10" height="10" fill="#000000" opacity="0.3" transform="translate(2.5 2.5)"/>
    <rect x="1" y="79" width="10" height="10" fill="#2f3134" stroke="#1a1b1d" stroke-width="1"/>
    <rect x="2" y="80" width="8" height="2" fill="#8a8f96" opacity="0.4"/>
    <rect x="79" y="79" width="10" height="10" fill="#000000" opacity="0.3" transform="translate(2.5 2.5)"/>
    <rect x="79" y="79" width="10" height="10" fill="#2f3134" stroke="#1a1b1d" stroke-width="1"/>
    <rect x="80" y="80" width="8" height="2" fill="#8a8f96" opacity="0.4"/>
    <g fill="#c9a24a" stroke="#6e5520" stroke-width="0.4">
      <circle cx="3.5" cy="3.5" r="1"/><circle cx="8.5" cy="8.5" r="1"/>
      <circle cx="81.5" cy="3.5" r="1"/><circle cx="86.5" cy="8.5" r="1"/>
      <circle cx="3.5" cy="81.5" r="1"/><circle cx="8.5" cy="86.5" r="1"/>
      <circle cx="81.5" cy="81.5" r="1"/><circle cx="86.5" cy="86.5" r="1"/>
    </g>
  </g>
</svg>
