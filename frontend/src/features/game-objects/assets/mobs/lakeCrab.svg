<svg width="100%" height="100%" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;">
  <!-- Placeholder Lake Crab avatar: the Sand Clamper recoloured lake blue (Sorrowfen, content-zone-7-swamp.md C9): a beach crab, close in, one huge serrated crusher raised, a small nipper, a spined shell rim, scowling eyes sunk into the shell, a cracked shell. Replaced when the crab gets its own art. -->
