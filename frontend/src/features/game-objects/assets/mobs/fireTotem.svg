<svg width="100%" height="100%" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;">
  <!-- Fire totem (2026-07-21): the carved totem face of totem.svg, but burning — charred wood, ember eyes, flame crown. Reads as a sibling of the plain totem, not a different object. -->
  <g transform="matrix(1.164025,0,0,1.164025,-57.510829,-54.018753)">
    <circle cx="269.333" cy="266.333" r="210.333" style="fill:url(#_Radial1);stroke:black;stroke-width:3.44px;"/>
  </g>
  <g transform="matrix(1.037243,0,0,1.037243,-23.363995,-20.252268)">
    <circle cx="269.333" cy="266.333" r="210.333" style="fill:rgb(74,44,24);"/>
    <clipPath id="_clip2"><circle cx="269.333" cy="266.333" r="210.333"/></clipPath>
    <g clip-path="url(#_clip2)">
      <g transform="matrix(3.6,0,0,3.6,269.333333,266.333333)"><g transform="matrix(1,0,0,1,-50,-50)">
        <!-- charred wooden disc (totem.svg silhouette, darker) -->
        <circle cx="50" cy="52" r="38" fill="#5a3418" stroke="#2e1a0a" stroke-width="4"/>
        <circle cx="50" cy="52" r="27" fill="#7a4a22" stroke="#2e1a0a" stroke-width="3.5"/>
        <!-- flame crown replacing the carved rays -->
        <path d="M 50 4 C 57 16 66 20 66 30 C 66 40 59 46 50 46 C 41 46 34 40 34 30 C 34 20 43 16 50 4 Z" fill="#d1420f" stroke="#5c1a06" stroke-width="3.5"/>
        <path d="M 50 18 C 54 26 58 29 58 34 C 58 39 54 42 50 42 C 46 42 42 39 42 34 C 42 29 46 26 50 18 Z" fill="#ffc247"/>
        <!-- ember eyes -->
        <circle cx="40" cy="52" r="5.5" fill="#ff7a18"/>
        <circle cx="60" cy="52" r="5.5" fill="#ff7a18"/>
        <!-- carved mouth -->
        <path d="M 34 68 L 42 64 L 50 70 L 58 64 L 66 68" fill="none" stroke="#2e1a0a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g></g>
    </g>
    <circle cx="269.333" cy="266.333" r="210.333" style="fill:none;stroke:black;stroke-width:2.89px;"/>
  </g>
  <defs>
    <radialGradient id="_Radial1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="matrix(0,210.333333,-210.333333,0,269.333333,266.333333)"><stop offset="0" style="stop-color:white;stop-opacity:1"/><stop offset="0.48" style="stop-color:rgb(198,198,198);stop-opacity:1"/><stop offset="1" style="stop-color:rgb(44,44,44);stop-opacity:1"/></radialGradient>
  </defs>
</svg>
