        <!-- brow + eyes -->
        <path d="M 34 56 L 44 61 M 66 56 L 56 61" stroke="#2a0d04" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="41" cy="66" r="5" fill="#2a0d04"/>
        <circle cx="59" cy="66" r="5" fill="#2a0d04"/>
      </g></g>
    </g>
    <circle cx="269.333" cy="266.333" r="210.333" style="fill:none;stroke:black;stroke-width:2.89px;"/>
