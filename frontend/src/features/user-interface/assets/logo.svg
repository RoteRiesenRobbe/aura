<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
	<!-- Aura icon (favicon source, webpack.common.js): a glowing core inside
	     two aura rings, in the brand orange (@brand, variables.less). -->
	<defs>
		<radialGradient id="glow">
			<stop offset="0" stop-color="#e37313" stop-opacity="0.55"/>
			<stop offset="0.7" stop-color="#e37313" stop-opacity="0.18"/>
			<stop offset="1" stop-color="#e37313" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="core" cx="0.4" cy="0.4" r="0.65">
			<stop offset="0" stop-color="#fff4cc"/>
			<stop offset="0.45" stop-color="#f9a53a"/>
			<stop offset="1" stop-color="#e37313"/>
		</radialGradient>
	</defs>
	<circle cx="500" cy="500" r="500" fill="url(#glow)"/>
	<circle cx="500" cy="500" r="430" fill="none" stroke="#e37313" stroke-width="60" stroke-opacity="0.6"/>
	<circle cx="500" cy="500" r="305" fill="none" stroke="#e37313" stroke-width="70" stroke-opacity="0.9"/>
	<circle cx="500" cy="500" r="185" fill="url(#core)"/>
</svg>
