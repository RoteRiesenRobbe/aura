<div id="gameUI" class="hidden hideForLeaderboard">
    <div id="minimap">
        <div class="wrapper">
            <!-- pixi.js instance here, to display minimap icons -->
        </div>
    </div>

    <div id="vitalSigns" class="layout-column">
        <div id="healthBar" class="bar flex">
            <div class="indicator"></div>
            <div class="negativeDeltaIndicator"></div>
            <div class="positiveDeltaIndicator"></div>
            <span class="barText"></span>
        </div>
        <div id="satietyBar" class="bar flex">
            <div class="indicator"></div>
            <div class="negativeDeltaIndicator"></div>
            <div class="positiveDeltaIndicator"></div>
            <span class="barText"></span>
        </div>
        <div id="bodyHeatBar" class="bar flex">
            <div class="indicator"></div>
            <div class="negativeDeltaIndicator"></div>
            <div class="positiveDeltaIndicator"></div>
        </div>
    </div>

    <!-- In-game zoom (fixed FOV, camera/logic/Zoom.ts): 1 = nearest, 3 = furthest -->
    <div id="zoomControl">
        <div class="zoomIcon">
            <svg viewBox="0 0 24 24">
                <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
                <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>
        <button id="zoomInButton" class="zoomButton">+</button>
        <div id="zoomLevelDisplay"></div>
        <button id="zoomOutButton" class="zoomButton">&minus;</button>
    </div>

    <div id="leftColumn">
        <div id="spellbook">
            <div class="spellbookTitle">Spellbook<span id="skillPointsBadge" class="hidden"></span></div>
            <ul id="spellbookList"></ul>
        </div>

        <div id="passiveLoadout">
            <div class="auraLoadoutTitle">Passives</div>
            <ul id="passiveSlotList">
                <li class="auraSlot passiveSlot" data-slot="0">— Empty —</li>
                <li class="auraSlot passiveSlot" data-slot="1">— Empty —</li>
                <li class="auraSlot passiveSlot" data-slot="2">— Empty —</li>
                <li class="auraSlot passiveSlot" data-slot="3">— Empty —</li>
            </ul>
        </div>
    </div>

    <!-- Bottom-center action bars: aura slots left, cooldowns right.
         Interim placement until the full UI pass. -->
    <div id="actionBars">
        <div id="auraLoadout">
            <div class="auraLoadoutTitle">Aura Slots</div>
            <ul id="auraSlotList">
                <li class="auraSlot hotkeySlot" data-slot="0"><span class="hotkey">1</span><span class="slotLabel">— Empty —</span></li>
                <li class="auraSlot hotkeySlot" data-slot="1"><span class="hotkey">2</span><span class="slotLabel">— Empty —</span></li>
                <li class="auraSlot hotkeySlot" data-slot="2"><span class="hotkey">3</span><span class="slotLabel">— Empty —</span></li>
                <li class="auraSlot hotkeySlot" data-slot="3"><span class="hotkey">4</span><span class="slotLabel">— Empty —</span></li>
            </ul>
        </div>

        <div id="cooldownLoadout">
            <div class="auraLoadoutTitle">Cooldowns</div>
            <ul id="cooldownSlotList">
                <li class="auraSlot hotkeySlot cooldownSlot" data-slot="0"><span class="hotkey">Q</span><span class="slotLabel">— Empty —</span><span class="cdRemaining"></span></li>
                <li class="auraSlot hotkeySlot cooldownSlot" data-slot="1"><span class="hotkey">E</span><span class="slotLabel">— Empty —</span><span class="cdRemaining"></span></li>
            </ul>
        </div>
    </div>

    <div id="chat" class="hidden">
        <textarea id="chatInput"
               autocomplete="false"
                  rows="1"
                  maxlength="120"></textarea>
    </div>
</div>
