<div id="registrationNag" class="hidden">
	<!--
	  The registration nag (plan-accounts-frontend.md §5.4).

	  Anonymous players only, and it lives OUTSIDE #accountScreens on purpose:
	  that container is hidden wholesale on Accept, and this banner has to
	  survive into the world. It is dismissible, and reopens on every fresh
	  login — the character-select → Play path — but NOT on a same-session page
	  refresh that resumes via reconnectToken, because that path is explicitly
	  designed to be invisible and a nag would fight its purpose.
	-->
	<span data-i18n="nagYourProgressLivesOnly" class="nagText">Your progress lives only on this device.</span>
	<a data-i18n="nagNagRegisterButton" href="#" class="button" id="nagRegisterButton">Create an account</a>
	<a data-i18n-attr="title:nagNagDismissButtonTitle" href="#" class="nagDismiss" id="nagDismissButton" title="Dismiss">&times;</a>
</div>
