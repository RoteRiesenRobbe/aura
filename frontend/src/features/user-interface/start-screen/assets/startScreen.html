<div id="startScreen" class="loading">
	<!-- TODO include splashscreen.jpg in Markup to make it load faster? -->
	<div id="splashScreen"></div>

	<!-- One centred column: the title above whichever panel is showing, so the
	     two can never overlap whatever the screen size. -->
	<div class="startColumn">
		<header class="layout-row hideForCredits hideForChangelog">
			<h1 data-i18n-skip>Aura</h1>
		</header>

		<div id="chromeWarning" class="playerForm layout-column hidden">
			<em data-i18n="start.browser.heading" class="warning">Warning</em>
			<p data-i18n-rich="start.browser.body">
				In the Beta version, the game only runs smoothly on an up to date
				<a data-i18n-tag="chrome" href="https://www.google.com/chrome" target="_blank">Chrome</a> or
				<a data-i18n-tag="firefox" href="https://www.mozilla.org/firefox" target="_blank">Firefox</a> browser.
			</p>
			<div class="layout-row">
				<a data-i18n="start.browser.continue-button" href="#" id="continueAnywayButton" class="button secondary flex-50">
					Continue anyway
				</a>
				<span style="width: 1rem;"></span>
				<a data-i18n="start.browser.get-chrome" href="https://www.google.com/chrome" target="_blank" class="button flex-50">
					Get Chrome
				</a>
			</div>
		</div>

		<!--
		  ⚑ PURE LOADING SCREEN. It used to carry the name field and the Play button;
		  a character now comes from the account screens, and leaving a dead form
		  here meant a slow boot (or a stalled one) showed the player a name box and
		  a button reading "Loading..." that never became clickable — it looked like
		  the game had hung on a form it was waiting for them to fill in.
		  Fullscreen is not offered here: the account screens and the settings
		  panel carry it. The players-online readout is appended by PlayerCount.ts.
		-->
		<div id="startForm" class="playerForm layout-column hideForCredits hideForChangelog">
			<div class="submitContainer">
				<div data-i18n="start.loading" id="loadingStatus">Loading…</div>
				<div id="loadingBar"></div>
			</div>

			<!--		<a href="#changelog" id="betaStamp"><img src="./betaStamp.svg" /></a>-->
	<!--		<a href="#changelog" id="betaStamp" class="text-mode">Playtest<br />20.10.2024</a>-->
			<a data-i18n="start.beta-stamp" href="#changelog" id="betaStamp" class="text-mode off-season">Prototype</a>
		</div>
	</div>

	<div class="menu infoContainer center bottom layout-row">
		<a data-i18n="start.credits" href="#credits">Credits</a>
		<a data-i18n="start.changelog" href="#changelog">Changelog</a>
<!--		<a href="http://iogames.space/" target="_blank">More IO-Games</a>-->
	</div>

	<a href="#" id="closeCredits" class="closeButton hidden hideForChangelog">X</a>
	<div id="creditsContainer" class="panel hidden">
		<!-- Filled via JS -->
	</div>

	<a href="#" id="closeChangelog" class="closeButton hidden hideForCredits">X</a>
	<div id="changelogContainer" class="panel hidden">
		<!-- Filled via JS -->
	</div>

	<div class="socialMediaContainer injected vertical infoContainer middle right layout-column"></div>
</div>
