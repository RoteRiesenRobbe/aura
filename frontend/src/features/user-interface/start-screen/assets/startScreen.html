<div id="startScreen" class="loading">
	<!-- TODO include splashscreen.jpg in Markup to make it load faster? -->
	<div id="splashScreen"></div>

	<header class="layout-row hideForCredits hideForChangelog">
		<img id="hunter" src="./hunter.png"/>
		<h1>Aura</h1>
	</header>

	<div id="chromeWarning" class="playerForm layout-column hidden">
		<em class="warning">Warning</em>
		<p>
			In the Beta version, the game only runs smoothly on an up to date
			<a href="https://www.google.com/chrome" target="_blank">Chrome</a> or
			<a href="https://www.mozilla.org/firefox" target="_blank">Firefox</a> browser.
		</p>
		<div class="layout-row">
			<a href="#" id="continueAnywayButton" class="button secondary flex-50">
				Continue anyway
			</a>
			<span style="width: 1rem;"></span>
			<a href="https://www.google.com/chrome" target="_blank" class="button flex-50">
				Get Chrome
			</a>
		</div>
	</div>

	<form id="startForm" class="playerForm layout-column hideForCredits hideForChangelog">
		<div class="inputContainer layout-row">
			<input class="playerNameInput flex"
			       placeholder="Some Name"
			       maxlength="20"
			       tabindex="0" />
		</div>
		<div class="optionsContainer layout-row layout-align-space-around-center">
			<div class="layout-row layout-align-center-end startFormToggle">
				<div class="switch">
					<input type="checkbox" id="fullscreenToggle">
					<label><i></i></label>
					<span></span>
				</div>
				<label for="fullscreenToggle">Fullscreen</label>
			</div>
		</div>
		<div class="submitContainer">
			<input type="submit" value="Loading..." class="playerNameSubmit" disabled="disabled"/>
			<div id="loadingBar"></div>
		</div>

		<!-- Players online (PlayerCount.ts). Starts hidden; the first successful
		     GET /players reveals it, so a server without the endpoint shows
		     nothing rather than a placeholder. -->
		<div id="playerCount" class="hidden" title="Players online">
			<span>currently online</span>
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
			     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
				<circle cx="12" cy="7" r="4"/>
			</svg>
			<span id="playerCountValue"></span>
		</div>

		<!--		<a href="#changelog" id="betaStamp"><img src="./betaStamp.svg" /></a>-->
<!--		<a href="#changelog" id="betaStamp" class="text-mode">Playtest<br />20.10.2024</a>-->
		<a href="#changelog" id="betaStamp" class="text-mode off-season">Prototype</a>
	</form>

	<div class="menu infoContainer center bottom layout-row">
		<a href="#credits">Credits</a>
		<a href="#changelog">Changelog</a>
<!--		<a href="http://iogames.space/" target="_blank">More IO-Games</a>-->
	</div>

	<a href="#" id="closeCredits" class="closeButton hidden hideForChangelog">X</a>
	<div id="creditsContainer" class="panel hidden">
		<!-- Filled via JS -->
	</div>

	<a href="#" id="closeChangelog" class="closeButton hidden hideForCredits">X</a>
	<div id="changelogContainer" class="panel hidden">
		<!-- Filled via JS -->
	</div>

	<div class="socialMediaContainer injected vertical infoContainer middle right layout-column"></div>
</div>
