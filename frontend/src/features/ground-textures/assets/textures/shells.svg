      <path d="M0,0 L-5,-11 M0,0 L-2,-12 M0,0 L2,-12 M0,0 L5,-11" fill="none" opacity="0.8"/>
    </g>
  </defs>
  <use href="#cockle" transform="translate(24 30) rotate(20)"/>
