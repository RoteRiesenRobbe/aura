<svg width="100px" height="100px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Placeholder decal: shells along the tide line. Three kinds, so a
       scatter of them reads as a beach and not as confetti: ribbed cockles
       (pale fans), mussels (blue-black ovals, the darkest marks on the sand)
       and periwinkles (small spirals). -->
