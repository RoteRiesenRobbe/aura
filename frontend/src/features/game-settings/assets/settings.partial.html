<div id="gameSettings">
    <button id="gameSettingsButton">
        <img src="settings-icon.svg" />
    </button>

    <section id="gameSettingsPanel" class="hidden">
        <a href="#" id="closeGameSettings" class="closeButton">X</a>

        <h2>Settings</h2>

        <h3>Audio</h3>
        <div class="setting-group">
            <div>
                <input type="checkbox" id="muteAllToggle" />
                <label for="muteAllToggle">Mute all</label>
            </div>
            <div>
                <label for="masterVolume">Master</label>
                <input type="range" id="masterVolume" name="volume" min="0" max="1" step="0.01"  />
                <span class="value">100</span>
            </div>
            <div>
                <label for="musicVolume">Music</label>
                <input type="range" id="musicVolume" name="volume" min="0" max="1" step="0.01"  />
                <span class="value">100</span>
            </div>

            <div>
                <input type="checkbox" id="backgroundAudioToggle" />
                <label for="backgroundAudioToggle">Play audio in background</label>
            </div>
        </div>

        <!--
          Skill effects (plan-skill-vfx.md §7.3, §12d.1). Radios rather than a
          slider: the three steps are named behaviours, not a continuum, and a
          radio's `change` event is the one HUD-safe listener here - MouseManager
          preventDefaults `mousedown` on the document, which eats the synthetic
          `click` the audio toggles would otherwise have used.
        -->
        <h3>Graphics</h3>
        <div class="setting-group">
            <fieldset id="vfxDensity" class="radio-row">
                <legend>Skill effects</legend>
                <div class="radio-options">
                    <div>
                        <input type="radio" name="vfxDensity" id="vfxDensityOff" value="off" />
                        <label for="vfxDensityOff">Off</label>
                    </div>
                    <div>
                        <input type="radio" name="vfxDensity" id="vfxDensityLow" value="low" />
                        <label for="vfxDensityLow">Low</label>
                    </div>
                    <div>
                        <input type="radio" name="vfxDensity" id="vfxDensityFull" value="full" />
                        <label for="vfxDensityFull">Full</label>
                    </div>
                </div>
            </fieldset>
            <p class="settingNote">
                Off keeps hit numbers and the aura ring; they are information,
                not dressing.
            </p>
        </div>

        <!--
          Account (plan-accounts-frontend.md §4, §5.4, §10b ruling 3 & 6).

          ⚑ There is deliberately NO "Log in" here. Login is reachable only
          while logged out, from the home screen: §6's discard soft-deletes
          every alive character on the anonymous account — which, in-world,
          would include the one being played — and /api/auth/login has no
          live-session check. Restricting reachability makes the case
          unreachable rather than guarded.
        -->
        <div id="accountSection">
        <h3>Account</h3>
        <div class="setting-group" id="accountSettings">
            <div id="accountAnonymous" class="hidden">
                <p class="settingNote">
                    You are playing without an account. Your progress lives only
                    on this device.
                </p>
                <a href="#" class="button" id="settingsRegisterButton">Create an account</a>
            </div>
            <div id="accountRegistered" class="hidden">
                <p class="settingNote">
                    Signed in as <span id="accountUsername"></span>.
                </p>
            </div>
            <a href="#" class="button secondary" id="leaveToCharacterSelect">
                Leave to character select
            </a>
        </div>
        </div>
    </section>
</div>
