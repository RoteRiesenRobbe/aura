<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Aura VFX preview</title>
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; }
		#fx-root { position: absolute; inset: 0; }
		#fx-label {
			position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 6px;
			font: 11px/1.3 sans-serif; color: #c9d1d9; pointer-events: none;
			display: flex; white-space: nowrap; overflow: hidden;
		}
		#fx-label span { flex: 0 0 auto; text-align: center; }
	</style>
</head>
<body>
	<div id="fx-root"></div>
	<div id="fx-label"></div>
</body>
</html>
