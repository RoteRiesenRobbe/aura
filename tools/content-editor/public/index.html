<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Aura Content Editor</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header id="top-bar">
  <h1>Aura Content Editor</h1>
  <div id="top-actions">
    <button id="revalidate-btn" title="Re-run validation across all content">Validate all</button>
    <span id="global-status"></span>
  </div>
</header>

<div id="layout">
  <nav id="sidebar">
    <div id="sidebar-tabs">
      <button class="tab-btn active" data-tab="npc">NPCs</button>
      <button class="tab-btn" data-tab="quest">Quests</button>
      <button class="tab-btn" data-tab="mob">Mobs</button>
      <button class="tab-btn" data-tab="faction">Factions</button>
      <button class="tab-btn" data-tab="recipe">Recipes</button>
      <button class="tab-btn" data-tab="milestones">Milestones</button>
    </div>
    <div class="sidebar-section" data-section="npc">
      <div class="sidebar-head">
        <input type="search" id="npc-filter" placeholder="filter…" />
        <button id="npc-new-btn" class="new-btn" title="Create a new NPC">+ New</button>
      </div>
      <ul id="npc-list" class="item-list"></ul>
    </div>
    <div class="sidebar-section" data-section="quest" hidden>
      <div class="sidebar-head">
        <input type="search" id="quest-filter" placeholder="filter…" />
        <button id="quest-new-btn" class="new-btn" title="Create a new quest">+ New</button>
      </div>
      <ul id="quest-list" class="item-list"></ul>
    </div>
    <div class="sidebar-section" data-section="mob" hidden>
      <div class="sidebar-head">
        <input type="search" id="mob-filter" placeholder="filter…" />
        <button id="mob-new-btn" class="new-btn" title="Create a new mob">+ New</button>
      </div>
      <ul id="mob-list" class="item-list"></ul>
    </div>
    <div class="sidebar-section" data-section="faction" hidden>
      <div class="sidebar-head">
        <input type="search" id="faction-filter" placeholder="filter…" />
        <button id="faction-new-btn" class="new-btn" title="Create a new faction">+ New</button>
      </div>
      <ul id="faction-list" class="item-list"></ul>
    </div>
    <div class="sidebar-section" data-section="recipe" hidden>
      <div class="sidebar-head">
        <input type="search" id="recipe-filter" placeholder="filter…" />
        <button id="recipe-new-btn" class="new-btn" title="Create a new recipe">+ New</button>
      </div>
      <ul id="recipe-list" class="item-list"></ul>
    </div>
    <div class="sidebar-section" data-section="milestones" hidden>
      <div class="sidebar-head">
        <span class="sidebar-hint">One shared file — every level unlock</span>
      </div>
      <ul id="milestones-list" class="item-list"></ul>
    </div>
  </nav>

  <main id="editor-pane">
    <div id="empty-state">Select an NPC, a quest, a mob, a faction, a recipe, or the milestone table on the left.</div>
    <div id="editor-root" hidden></div>
  </main>

  <aside id="validation-panel">
    <h2>Validation</h2>
    <div id="validation-summary"></div>
    <ul id="validation-list"></ul>
  </aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
