<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 160" preserveAspectRatio="none">
  <!-- Roof kit: HIP END, the sloped cap that closes a run. TRUE top-down, a
       ROOF piece. viewBox 80x160 = the 2 x 4 rect body in api/props/roof-hip-*.json
       (preserveAspectRatio=none); 40 units per metre. The span's ridge arrives at
       the WEST edge's middle and stops; two hips run at 45 degrees to the east
       corners, so the north and south pitches end in triangles and the third
       pitch faces east. Turn it 180 degrees to cap a run's west end.
       NEUTRAL light grey: tinted by the definition. Shading falls toward each
       eave, so a turned piece stays lit the same. -->
  <defs>
    <pattern id="roofHipShingle" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="10" fill="#5b5652"/>
      <rect x="20" y="0" width="20" height="10" fill="#57524e"/>
      <rect x="-10" y="10" width="20" height="10" fill="#5f5a55"/>
      <rect x="10" y="10" width="20" height="10" fill="#595450"/>
      <rect x="30" y="10" width="20" height="10" fill="#5f5a55"/>
      <path d="M0,10 H40 M0,20 H40 M0,0 V10 M20,0 V10 M10,10 V20 M30,10 V20" fill="none" stroke="#3b3735" stroke-width="1"/>
    </pattern>
    <!-- the east pitch's courses run north-south, parallel to its eave -->
    <pattern id="roofHipShingleV" href="#roofHipShingle" patternTransform="rotate(90)"/>
    <linearGradient id="roofHipNorth" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="roofHipSouth" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="160">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="roofHipEast" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- north and south pitches (triangles), then the east pitch -->
  <polygon points="0,0 80,0 0,80" fill="url(#roofHipShingle)"/>
  <polygon points="0,0 80,0 0,80" fill="url(#roofHipNorth)"/>
  <polygon points="0,80 80,160 0,160" fill="url(#roofHipShingle)"/>
  <polygon points="0,80 80,160 0,160" fill="url(#roofHipSouth)"/>
  <polygon points="0,80 80,0 80,160" fill="url(#roofHipShingleV)"/>
  <polygon points="0,80 80,0 80,160" fill="url(#roofHipEast)"/>

  <!-- eaves -->
  <rect x="0" y="0" width="80" height="2.5" fill="#000000" opacity="0.28"/>
  <rect x="0" y="157.5" width="80" height="2.5" fill="#000000" opacity="0.28"/>
  <rect x="77.5" y="0" width="2.5" height="160" fill="#000000" opacity="0.28"/>

  <!-- the two hip caps, and the ridge cap's end where the span's ridge arrives -->
  <path d="M0,80 L80,0 M0,80 L80,160" stroke="#33302e" stroke-width="9" stroke-linecap="butt"/>
  <path d="M0,80 L80,0 M0,80 L80,160" stroke="#645f5a" stroke-width="6.5" stroke-linecap="butt"/>
  <path d="M0,80 L80,0 M0,80 L80,160" stroke="#6b6560" stroke-width="1.5" opacity="0.6"/>
  <path d="M0,74 H6 Q11,80 6,86 H0 Z" fill="#645f5a" stroke="#33302e" stroke-width="1.4"/>
</svg>
